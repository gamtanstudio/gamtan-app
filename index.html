function bookingCard(b) {
  if(!b.product || !PRODUCTS[b.product]) b.product = 'story';
  const p = PRODUCTS[b.product];
  const stage = b.currentStage||0;
  const isId = b.product==='id';
  const isAllDone = isId ? stage >= 2 : stage >= 8;
  const hasShooting = !isId && stage > 3;
  const numDots = isId ? 2 : 8;
  const dots = isId
    ? Array.from({length:2},(_,i)=>{
        const cls = isAllDone ? 'final-done' : i<stage ? 'pre-done' : i===stage ? 'pre-cur' : '';
        return `<div class="bc-dot ${cls}"></div>`;
      }).join('')
    : Array.from({length:8},(_,i)=>{
        let cls = '';
        if(isAllDone) {
          cls = i === 7 ? 'final-done' : (i >= 3 ? 'post-done' : 'pre-done');
        } else {
          const isPost = i >= 3;
          if(!isPost) {
            cls = i<stage ? 'pre-done' : i===stage ? 'pre-cur' : '';
          } else {
            if(i < stage) cls = hasShooting ? 'post-done' : 'post-wait';
            else if(i === stage) cls = hasShooting ? 'post-cur' : 'pre-cur';
            else cls = 'post-wait';
          }
        }
        return (i===3 ? '<span class="bc-sep">📷</span>' : '') + `<div class="bc-dot ${cls}"></div>`;
      }).join('');
  const completedCls = isAllDone ? ' completed' : '';
  const unpaid = isUnpaid(b);
  const unpaidStyle = unpaid ? 'border-color:#fca5a5 !important;background:#fff5f5;' : '';
  // 인원/옵션 칩
  const adults = parseInt(b.adults)||0;
  const kids = parseInt(b.kids)||0;
  const personChips = [];
  if(adults>0) personChips.push(`<span style="font-size:10px;background:#e0f2fe;color:#0369a1;border-radius:6px;padding:1px 6px;white-space:nowrap">👨‍👩 성인 ${adults}명</span>`);
  if(kids>0)   personChips.push(`<span style="font-size:10px;background:#fef9c3;color:#713f12;border-radius:6px;padding:1px 6px;white-space:nowrap">🧒 아이 ${kids}명</span>`);
  if(b.pet)    personChips.push(`<span style="font-size:10px;background:#fce7f3;color:#9d174d;border-radius:6px;padding:1px 6px;white-space:nowrap">🐶 반려견</span>`);
  const personRow = personChips.length
    ? `<div style="margin-top:4px;display:flex;flex-wrap:wrap;gap:3px">${personChips.join('')}</div>`
    : '';
  // 가족 이름 파싱
  const familyChips = b.familyNames
    ? b.familyNames.split(',').map(s=>s.trim()).filter(Boolean)
        .map(s=>`<span style="font-size:10px;background:#faf5ff;color:#6b21a8;border-radius:6px;padding:1px 6px;white-space:nowrap">👤${s}</span>`).join('')
    : '';
  const memoSnip = b.memo && b.memo.trim()
    ? `<div style="font-size:10px;color:#92400e;background:#fef3c7;border-radius:5px;padding:2px 7px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%">📝 ${b.memo.trim().replace(/\n/g,' ').substring(0,40)}${b.memo.trim().length>40?'…':''}</div>`
    : '';
  const extraRow = (familyChips || memoSnip)
    ? `<div style="margin-top:4px;display:flex;flex-wrap:wrap;gap:3px;align-items:center">${familyChips}</div>${memoSnip}`
    : '';
  const progressBadge = getProgressBadge(b);
  const postponeBadge = b.postponed
    ? `<span style="font-size:10px;background:#fff7ed;color:#c2410c;border:1px solid #fed7aa;border-radius:6px;padding:1px 6px;white-space:nowrap;flex-shrink:0">📅 연기${b.postponedDate?' → '+fmtDateKo(b.postponedDate):''}</span>`
    : '';
  const snsBadge = b.snsConsent
    ? `<span style="font-size:10px;background:#fef2f2;color:#dc2626;border-radius:6px;padding:1px 5px;flex-shrink:0;font-weight:700">SNS✓</span>`
    : '';
  const totalPeople = adults + kids;
  const totalBadge = totalPeople > 0
    ? `<span style="font-size:12px;font-weight:800;color:#1d4ed8;background:#dbeafe;border-radius:8px;padding:2px 8px;white-space:nowrap;flex-shrink:0">👥 ${totalPeople}명</span>`
    : '';
  const peopleDetail = totalPeople > 0
    ? `<div style="margin-top:4px;display:flex;gap:4px;align-items:center;flex-wrap:wrap">
        ${adults>0?`<span style="font-size:10px;background:#e0f2fe;color:#0369a1;border-radius:6px;padding:1px 6px;white-space:nowrap">성인 ${adults}명</span>`:''}
        ${kids>0?`<span style="font-size:10px;background:#fef9c3;color:#713f12;border-radius:6px;padding:1px 6px;white-space:nowrap">아이 ${kids}명</span>`:''}
        ${b.pet?`<span style="font-size:10px;background:#fce7f3;color:#9d174d;border-radius:6px;padding:1px 6px;white-space:nowrap">🐶 반려견</span>`:''}
      </div>`
    : (b.pet?`<div style="margin-top:4px"><span style="font-size:10px;background:#fce7f3;color:#9d174d;border-radius:6px;padding:1px 6px">🐶 반려견</span></div>`:'');
  return `<div class="booking-card${b.id===selectedId?' active':''}${completedCls}" onclick="selectBooking('${b.id}')" style="${unpaid?'border-color:#fca5a5;background:#fff8f8;':''}">
    <div class="bc-top">
      <span class="bc-name">${b.name}</span>
      ${totalBadge}
      ${unpaid ? UNPAID_BADGE : ''}
      ${progressBadge || ''}
      ${postponeBadge}
      ${snsBadge}
      <span class="bc-prod" style="background:${p.color}">${p.name}${(b.product==='bigfam'&&b.bigfamUpgrade)?' → '+(BIGFAM_ALBUMS.find(a=>a.key===(b.bigfamAlbum||'20al'))?.label||'앨범'):''}</span>
      <span class="bc-time">${fmtTime(b.time)}</span>${b.weekend?'<span style="font-size:11px">📅</span>':''}
    </div>
    ${peopleDetail}
    ${extraRow}
  </div>`;
}

function selectBooking(id) {
  selectedId = id;
  localStorage.setItem('gamtan_selected_id', id);
  const b = bookings.find(x=>x.id===id);
  renderList();
  if(b) {
    renderWorkflow(b);
    const right = document.getElementById('right');
    if(right) {
      right.scrollTop = 0;
      if(window.innerWidth <= 768) {
        right.classList.add('mobile-show');
        const nameEl = document.getElementById('mobile-back-name');
        if(nameEl) nameEl.textContent = b.name + '님';
      }
    }
    pushNav({ view: currentView, bookingId: id });
  }
}

function mobileGoBack() {
  document.getElementById('right').classList.remove('mobile-show');
  selectedId = null;
  localStorage.removeItem('gamtan_selected_id');
  renderList();
}

function clearWorkflow() {
  document.getElementById('empty-state').style.display='flex';
  document.getElementById('workflow').style.display='none';
}

function renderWorkflow(b) {
  if(!b.product || !PRODUCTS[b.product]) b.product = 'story';
  document.getElementById('empty-state').style.display='none';
  const wf = document.getElementById('workflow');
  wf.style.display='block';
  const p = PRODUCTS[b.product];
  const stage = b.currentStage||0;
  const isId = b.product==='id';
  const numStages = isId ? 2 : 8;
  const stageNamesArr = isId ? ID_STAGE_NAMES : STAGE_NAMES;
  const hasKids = b.hasKids || p.requiresKids || p.kidsOnly;
  const adlt = b.adults>0 ? adultStr(b) : '';
  const kid = b.kids>0 ? kidsStr(b) : '';
  const personStr = [adlt,kid].filter(Boolean).join(' + ');

  const spSteps = Array.from({length:numStages},(_,i)=>`<div class="sp-step${i<stage?' done':i===stage?' current':''}" onclick="jumpToStage('${b.id}',${i})" title="${stageNamesArr[i]}"></div>`).join('');
  const spNums = Array.from({length:numStages},(_,i)=>`<span class="sp-num${i===stage?' active':''}">${i+1}</span>`).join('');

  let stagesHtml = '';
  for(let i=0;i<numStages;i++) {
    const isDone = i<stage;
    const isCurrent = i===stage;
    const statusClass = isDone?'ss-done':isCurrent?'ss-current':'ss-pending';
    const statusText = isDone?'✓ 완료':isCurrent?'진행 중':'대기';
    const bodyOpen = isCurrent ? ' open' : '';
    const sectionClass = isDone?' done-stage':isCurrent?' current-stage':'';
    stagesHtml += `<div class="stage-section${sectionClass}" id="stage-sec-${i}">
      <div class="stage-header" onclick="toggleStage(${i})">
        <div class="stage-num">${i+1}</div>
        <div class="stage-title">${stageNamesArr[i]}</div>
        <span class="stage-status ${statusClass}">${statusText}</span>
        <span class="stage-chevron" id="chev-${i}">${bodyOpen?'▲':'▼'}</span>
      </div>
      <div class="stage-body${bodyOpen}" id="stage-body-${i}">
        ${buildStageBody(b, i, isDone, isCurrent)}
      </div>
    </div>`;
  }

  const custNoWf = getCustNo(b.name);
  const phoneHtml = b.phone ? `<span style="background:#e0f2fe;color:#0369a1;font-size:12px;border-radius:8px;padding:2px 8px">📞 ${b.phone}</span><button onclick="openAligoSend('${b.phone}','')" title="문자 발송" style="background:#ede9fe;color:#6d28d9;border:1px solid #c4b5fd;border-radius:6px;padding:2px 8px;font-size:11px;cursor:pointer;font-weight:600;margin-left:4px">📤 문자</button>` : '';
  const emailHtml = b.email ? `<a href="https://mail.naver.com/write/?to=${encodeURIComponent(b.email)}" target="_blank" style="background:#f0fdf4;color:#166534;font-size:12px;border-radius:8px;padding:2px 8px;text-decoration:none;cursor:pointer" title="네이버 메일 보내기">✉️ ${b.email}</a>` : '';
  const familyHtml = b.familyNames ? b.familyNames.split(',').map(s=>`<span style="background:#faf5ff;color:#6b21a8;font-size:12px;border-radius:8px;padding:2px 8px">👤 ${s.trim()}</span>`).join('') : '';
  const extraInfo = [phoneHtml, emailHtml, familyHtml].filter(Boolean).join(' ');
  const postponeHtml = b.postponed
    ? `<span style="font-size:11px;background:#fff7ed;color:#c2410c;border:1px solid #fed7aa;border-radius:6px;padding:2px 8px">📅 연기${b.postponedDate?' → '+fmtDateKo(b.postponedDate):''}</span>`
    : '';
  const snsHtml = b.snsConsent
    ? `<span style="font-size:11px;background:#fef2f2;color:#dc2626;border-radius:6px;padding:2px 8px;font-weight:700">📷 SNS 동의</span>`
    : `<span style="font-size:11px;background:#f9fafb;color:#9ca3af;border-radius:6px;padding:2px 8px">SNS 미동의</span>`;
  const {label:curLabel,color:curColor} = getDynamicStatusLabel(b);
  wf.innerHTML = `
    <div id="cust-card">
      <span class="prod-badge" style="background:${p.color}">${p.name}${(b.product==='bigfam'&&b.bigfamUpgrade) ? ' → ' + (BIGFAM_ALBUMS.find(a=>a.key===(b.bigfamAlbum||'20al'))?.label||'앨범') : ''}</span>
      <div id="cust-info">
        <h3>${b.name}님 <span style="font-size:12px;background:#e0e7ff;color:#4338ca;border-radius:6px;padding:2px 7px;font-weight:700;vertical-align:middle">#${custNoWf}</span>
          <span style="font-size:12px;font-weight:700;color:${curColor};background:#f9f9f9;border-radius:6px;padding:2px 7px;margin-left:4px">${curLabel}</span>
        </h3>
        <p>${personStr} · ${fmtDateKo(b.date)} ${fmtTime(b.time)}</p>
        <div style="margin-top:4px;display:flex;flex-wrap:wrap;gap:4px">
          ${extraInfo}
          ${postponeHtml}
          ${snsHtml}
        </div>
      </div>
      <button class="btn-delete" style="margin-left:auto" onclick="openEditModal('${b.id}')">✏️ 수정</button>
    </div>
    <div style="border-radius:10px;overflow:hidden;margin-bottom:12px;border:1px solid #e8e8e8">
      <div onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.sp-chev').textContent=this.nextElementSibling.classList.contains('open')?'▲':'▼'"
        style="display:flex;align-items:center;padding:10px 14px;cursor:pointer;background:#f8f9fa;user-select:none">
        <span style="font-size:12px;font-weight:700;color:#555;flex:1">📋 단계 진행 현황 (${stage+1}/${numStages}단계)</span>
        <span class="sp-chev" style="color:#aaa;font-size:12px">▼</span>
      </div>
      <div style="padding:10px 14px;display:none" class="">
        <div class="sp-label">진행 단계 (클릭하면 해당 단계로 이동)</div>
        <div class="sp-bar">${spSteps}</div>
        <div class="sp-nums">${spNums}</div>
      </div>
    </div>
    ${buildPhotoSection(b.name, b.id)}
    ${stagesHtml}
    <div class="stage-section" style="border:2px solid #f59e0b">
      <div class="stage-header" style="cursor:default">
        <div class="stage-num" style="background:#f59e0b">📝</div>
        <div class="stage-title">메모 — ${b.name}님 (${fmtDateKo(b.date)})</div>
      </div>
      <div class="stage-body open" id="memo-body-${b.id}" style="padding-top:8px">
        <textarea class="date-memo-ta" rows="4" placeholder="" oninput="saveMemo('${b.id}',this)">${b.memo||''}</textarea>
      </div>
    </div>
  `;
  // wf-modal이 열려 있으면 #workflow 내용을 wf-modal-body로 이동 (중복 ID 방지를 위해 #workflow는 비움)
  const _wfModal = document.getElementById('wf-modal');
  if(_wfModal && _wfModal.classList.contains('open')) {
    const wfBody = document.getElementById('wf-modal-body');
    if(wfBody) {
      wfBody.innerHTML = wf.innerHTML;
      wf.innerHTML = '';
      wf.style.display = 'none';
      document.getElementById('empty-state').style.display = 'flex';
    }
  }
}

function buildIdStageBody(b, stageIdx, isDone, isCurrent) {
  const p = PRODUCTS[b.product];
  const dateKo = fmtDateKo(b.date);
  const timeStr = fmtTime(b.time);
  const endTime = addMinutes(b.time, p.duration);
  const clItems = stageIdx===0
    ? [{title:'SM메이트에 예약 등록', detail:`고객명: ${b.name} | 상품: 증명사진 | 날짜: ${dateKo} | 시간: ${timeStr} ~ ${endTime}`},
       {title:'네이버 플레이스 해당 시간 차단', detail:'촬영 시간 차단 설정'}]
    : [{title:'웹용 파일 정리 및 발송', detail:'JPG/PNG 파일 카톡 또는 이메일 전송'},
       {title:'웹파일 발송 메시지 전송', detail:'완료 안내 메시지 전송'}];
  const checks = b.stageChecks?.[stageIdx]||{};
  const clHtml = clItems.map((item,j)=>`
    <div class="cl-item${checks[j]?' checked':''}" data-bid="${b.id}" data-stage="${stageIdx}" data-idx="${j}" onclick="toggleCheck('${b.id}',${stageIdx},${j})">
      <div class="cl-cb">${checks[j]?'✓':''}</div>
      <div class="cl-text">
        <div class="cl-title">${item.title}</div>
        ${item.detail?`<div class="cl-detail">${item.detail}</div>`:''}
      </div>
    </div>`).join('');
  const doneBtn = isCurrent
    ? `<button class="btn-done" onclick="completeStage('${b.id}',${stageIdx})" style="width:100%">✓ ${stageIdx===1?'웹파일 발송 완료':'예약 접수 완료'}</button>`
    : isDone
    ? `<button class="btn-undone" onclick="undoStage('${b.id}',${stageIdx})">↩ 단계 되돌리기</button>`
    : '';
  let msgHtml = '';
  if(stageIdx===1) {
    msgHtml = `<div style="margin-bottom:10px">${doneBtn}</div>` + buildPriceBox(b) + buildMsgHtml(b, stageIdx, getMsgIdWebfile(b));
    return `<div class="checklist"><h4>체크리스트</h4>${clHtml}</div>${msgHtml}`;
  }
  return `<div class="checklist"><h4>체크리스트</h4>${clHtml}</div><div style="margin-top:12px">${doneBtn}</div>`;
}
function buildStageBody(b, stageIdx, isDone, isCurrent) {
  if(b.product==='id') return buildIdStageBody(b, stageIdx, isDone, isCurrent);
  const clItems = getChecklistItems(b, stageIdx);
  const checks = b.stageChecks?.[stageIdx]||{};
  const clHtml = clItems.map((item,j)=>`
    <div class="cl-item${checks[j]?' checked':''}" data-bid="${b.id}" data-stage="${stageIdx}" data-idx="${j}" onclick="toggleCheck('${b.id}',${stageIdx},${j})">
      <div class="cl-cb">${checks[j]?'✓':''}</div>
      <div class="cl-text">
        <div class="cl-title">${item.title}</div>
        ${item.detail?`<div class="cl-detail">${item.detail}</div>`:''}
      </div>
    </div>`).join('');

  let msgHtml = '';
  if(stageIdx <= 2) {
    // stages 1-3: product-specific messages, some have variant options
    let variantHtml = '';
    let msgText = '';
    if(stageIdx===0) {
      msgText = getMsg1(b);
    } else if(stageIdx===1) {
      msgText = getMsg2(b);
    } else if(stageIdx===2) {
      msgText = getMsg3(b);
    }
    const rescheduleBtn = stageIdx===1
      ? `<div style="margin-top:10px">
          <button onclick="openEditModal('${b.id}')" style="background:#fff7ed;color:#c2410c;border:1.5px solid #fed7aa;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;font-weight:600">📅 미입금 — 스케줄 변경</button>
         </div>`
      : '';
    // 1단계(예약 접수): 일반 문자 보내기 버튼 + 발송 체크
    const smsSent = b.smsSent || false;
    const smsBtn = stageIdx===0
      ? `<div style="margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          ${b.phone
            ? `<a href="sms:${b.phone}" style="display:inline-flex;align-items:center;gap:6px;background:#fff;color:#16a34a;border:1.5px solid #86efac;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;font-weight:600;text-decoration:none">💬 일반 문자 보내기 <span style="font-size:11px;color:#888">${b.phone}</span></a>`
            : `<span style="font-size:12px;color:#aaa">📵 전화번호 미등록 (예약 수정에서 추가)</span>`
          }
          <div onclick="toggleSmsSent('${b.id}')" id="sms-check-${b.id}"
            style="display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;cursor:pointer;user-select:none;
              background:${smsSent?'#f0fdf4':'#f8f9fa'};border:1.5px solid ${smsSent?'#86efac':'#e0e0e0'};transition:all .2s">
            <div style="width:18px;height:18px;border-radius:4px;border:2px solid ${smsSent?'#16a34a':'#ccc'};background:${smsSent?'#16a34a':'#fff'};
              display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s">
              ${smsSent?'<span style="color:#fff;font-size:11px;font-weight:900;line-height:1">✓</span>':''}
            </div>
            <span style="font-size:13px;font-weight:600;color:${smsSent?'#16a34a':'#888'}">문자 발송 완료</span>
          </div>
         </div>`
      : '';
    msgHtml = buildMsgHtml(b, stageIdx, msgText) + smsBtn + rescheduleBtn;
  } else if(stageIdx===3) {
    // stage 4: 원본 발송 — 가격 계산 + 3가지 메시지 타입 선택
    const priceBox = buildPriceBox(b);
    const typeKey4 = `${b.id}_msg4type`;
    const savedType4 = currentMsgTypes[typeKey4] || 'kakao1';
    const msg4Text = getMsg4(b, savedType4);
    const type4Btns = [
      {val:'kakao1', label:'💬 카톡 (성장용)'},
      {val:'email',  label:'📧 이메일'},
      {val:'kakao2', label:'💬 카톡 (일반)'}
    ].map(t=>
      `<button class="msg-opt-btn${savedType4===t.val?' active':''}" onclick="setMsgType4('${b.id}','${t.val}')">${t.label}</button>`
    ).join('');
    const extraBox = buildExtraItemsBox(b);
    msgHtml = `${priceBox}${extraBox}<div class="msg-section">
      <h4>메시지 유형</h4>
      <div class="msg-options">${type4Btns}</div>
      ${buildMsgArea(b, stageIdx, msg4Text)}
    </div>`;
  } else if(stageIdx===4) {
    // stage 5: 리뷰/포켓 — 체크리스트만, 메시지 없음
    msgHtml = '';
  } else if(stageIdx===6) {
    // stage 7: 액자 완료 — frame selector + message type
    const defaultFrame = getDefaultFrame(b.product);
    const frameKey = `${b.id}_frame`;
    const typeKey = `${b.id}_msgtype`;
    const savedFrame = currentFrames[frameKey] || defaultFrame;
    const savedType = currentMsgTypes[typeKey] || 'inquiry';
    const frameText = getMsg6(b, savedFrame, savedType);
    const frameBtns = ['5x7인치','8x10인치','11x14인치','캔버스','5x10인치','4x6인치'].map(f=>
      `<button class="frame-btn${savedFrame===f?' active':''}" onclick="setFrame('${b.id}','${f}')">${f}</button>`
    ).join('');
    const typeBtns = [
      {val:'inquiry',  label:'📦 수령 방법 문의'},
      {val:'delivery', label:'🚚 택배 발송 완료'}
    ].map(t=>
      `<button class="msg-opt-btn${savedType===t.val?' active':''}" onclick="setMsgType6('${b.id}','${t.val}')">${t.label}</button>`
    ).join('');
    msgHtml = `<div class="msg-section">
      <h4>메시지 유형</h4>
      <div class="msg-options">${typeBtns}</div>
      <h4>액자 사이즈 선택</h4>
      <div class="frame-selector">
        ${frameBtns}
        <input class="frame-custom" type="text" placeholder="직접 입력" id="frame-custom-${b.id}" onchange="setFrame('${b.id}',this.value)" value="${['5x7인치','8x10인치','11x14인치','캔버스','5x10인치','4x6인치'].includes(savedFrame)?'':savedFrame}">
      </div>
      ${buildMsgArea(b, stageIdx, frameText)}
    </div>`;
  } else if(stageIdx===7) {
    // stage 8: 보정본 발송 — 출고 목록 + 3가지 메시지 타입
    const shippingBox = buildShippingBox(b);
    const typeKey8 = `${b.id}_msg8type`;
    const savedType8 = currentMsgTypes[typeKey8] || 'kakao';
    const msg8Text = getMsg8(b, savedType8);
    const type8Btns = [
      {val:'kakao',     label:'💬 카톡'},
      {val:'email',     label:'📧 이메일'},
      {val:'navertalk', label:'🟢 네이버 톡톡'}
    ].map(t=>
      `<button class="msg-opt-btn${savedType8===t.val?' active':''}" onclick="setMsgType8('${b.id}','${t.val}')">${t.label}</button>`
    ).join('');
    msgHtml = `${shippingBox}<div class="msg-section">
      <h4>메시지 유형</h4>
      <div class="msg-options">${type8Btns}</div>
      ${buildMsgArea(b, stageIdx, msg8Text)}
    </div>`;
  } else {
    let msgText = '';
    if(stageIdx===5) msgText = getMsg5(b);
    msgHtml = buildMsgHtml(b, stageIdx, msgText);
  }

  const doneBtn = isCurrent
    ? `<button class="btn-done" onclick="completeStage('${b.id}',${stageIdx})">✓ 이 단계 완료</button>`
    : isDone
    ? `<button class="btn-undone" onclick="undoStage('${b.id}',${stageIdx})">↩ 단계 되돌리기</button>`
    : '';

  return `
    <div class="checklist">
      <h4>체크리스트</h4>
      ${clHtml||'<div style="color:#bbb;font-size:13px">체크 항목 없음</div>'}
    </div>
    ${msgHtml}
    <div style="margin-top:12px">${doneBtn}</div>
  `;
}

function buildMsgHtml(b, stageIdx, msgText) {
  return `<div class="msg-section">
    <h4>발송 메시지</h4>
    ${buildMsgArea(b, stageIdx, msgText)}
  </div>`;
}

function buildMsgArea(b, stageIdx, msgText) {
  return `<div class="msg-box">
    <textarea class="msg-ta" id="msg-ta-${b.id}-${stageIdx}" rows="10">${msgText}</textarea>
  </div>
  <div class="msg-actions">
    <button class="btn-copy" id="btn-copy-${b.id}-${stageIdx}" onclick="copyMsg('${b.id}',${stageIdx})">📋 복사</button>
  </div>`;
}

function getDefaultFrame(prod) {
  const map = {story:'8x10인치',simpfam:'5x7인치',bigfam:'8x10인치',growth:'8x10인치',kids:'5x7인치',profile:'5x7인치',jangsu:'11x14인치',id:'5x7인치'};
  return map[prod]||'5x7인치';
}

function toggleCheck(id, stageIdx, checkIdx) {
  const b = bookings.find(x=>x.id===id);
  if(!b) return;
  if(!b.stageChecks) b.stageChecks={};
  if(!b.stageChecks[stageIdx]) b.stageChecks[stageIdx]={};
  b.stageChecks[stageIdx][checkIdx] = !b.stageChecks[stageIdx][checkIdx];
  const checked = b.stageChecks[stageIdx][checkIdx];

  // 5단계(리뷰/포켓) 고객 리뷰 확인 체크 → 카드 별 자동 연동
  if(stageIdx===4 && checkIdx===0) {
    b.reviewed = checked;
    // 왼쪽 카드 별 버튼 즉시 업데이트
    document.querySelectorAll('.bc-review').forEach(btn=>{
      if(btn.getAttribute('onclick')&&btn.getAttribute('onclick').includes(id)) {
        btn.classList.toggle('reviewed', checked);
        btn.textContent = checked ? '⭐' : '☆';
        btn.title = checked ? '리뷰 완료' : '리뷰 미완료';
      }
    });
  }

  saveBookings();
  const clEl = document.querySelector(`.cl-item[data-bid="${id}"][data-stage="${stageIdx}"][data-idx="${checkIdx}"]`);
  if(clEl) {
    clEl.classList.toggle('checked', checked);
    clEl.querySelector('.cl-cb').textContent = checked ? '✓' : '';
  }
  // 체크리스트는 메시지 복사 전용 — 왼쪽 카드 상태 배지 갱신 안 함
}

function copyMsg(id, stageIdx) {
  const ta = document.getElementById(`msg-ta-${id}-${stageIdx}`);
  if(!ta) return;
  const btn = document.getElementById(`btn-copy-${id}-${stageIdx}`);
  const text = ta.value;
  // 순수 텍스트로만 복사 (서식 없음 → 붙여넣기 시 테두리/스타일 없음)
  navigator.clipboard.writeText(text).then(()=>{
    if(btn) { btn.textContent='✓ 복사됨'; btn.classList.add('copied'); setTimeout(()=>{ btn.textContent='📋 복사'; btn.classList.remove('copied'); },2000); }
  }).catch(()=>{
    // 폴백: textarea 직접 선택 복사
    ta.select();
    try { document.execCommand('copy'); } catch(e) {}
    ta.setSelectionRange(0,0);
    if(btn) { btn.textContent='✓ 복사됨'; btn.classList.add('copied'); setTimeout(()=>{ btn.textContent='📋 복사'; btn.classList.remove('copied'); },2000); }
  });
}

function completeStage(id, stageIdx) {
  const b = bookings.find(x=>x.id===id);
  if(!b) return;
  b.currentStage = stageIdx + 1;
  const maxS = b.product==='id' ? 2 : 8;
  if(b.currentStage >= maxS) b.completed = true;
  saveBookings();
  renderWorkflow(b);
  renderList();
}

function undoStage(id, stageIdx) {
  const b = bookings.find(x=>x.id===id);
  if(!b) return;
  b.currentStage = stageIdx;
  b.completed = false;
  saveBookings();
  renderWorkflow(b);
  renderList();
}

function saveBooking() {
  const name = document.getElementById('f-name').value.trim();
  if(!name) { alert('이름을 입력해주세요.'); return; }
  const phone = document.getElementById('f-phone').value.trim();
  const email = document.getElementById('f-email').value.trim();
  const familyNames = document.getElementById('f-familynames').value.trim();
  const product = document.getElementById('f-product').value;
  const adults = parseInt(document.getElementById('f-adults').value)||0;
  const kids = parseInt(document.getElementById('f-kids').value)||0;
  const childName = document.getElementById('f-childname').value.trim();
  const date = document.getElementById('f-date').value;
  const time = document.getElementById('f-time').value;
  const hasKids = document.getElementById('f-has-kids').checked;
  const pet = document.getElementById('f-pet').checked;
  const weekend = document.getElementById('f-weekend').checked;
  const postponedDate = document.getElementById('f-postponed').value || '';
  const snsConsent = document.getElementById('f-sns-consent').checked;
  const idType        = product==='id' ? (document.querySelector('input[name="f-id-type"]:checked')?.value || 'passport') : undefined;
  const idWebFile     = product==='id' ? (document.getElementById('f-id-webfile')?.checked     || false) : false;
  const idPassportAdd = product==='id' ? (document.getElementById('f-id-passport-add')?.checked || false) : false;
  const idIdCardAdd   = product==='id' ? (document.getElementById('f-id-idcard-add')?.checked   || false) : false;
  // 가족성장 계약 필드
  const dateTbd       = product==='growth' ? (document.getElementById('f-date-tbd')?.checked||false) : false;
  const contractYears = product==='growth' ? parseInt(document.querySelector('input[name="f-contract-years"]:checked')?.value||'5') : undefined;
  const contractYear  = product==='growth' ? parseInt(document.getElementById('f-contract-year')?.value||'1') : undefined;

  if(!dateTbd && !date) { alert('날짜를 선택해주세요.'); return; }

  const editId = document.getElementById('edit-id').value;

  // ── 동명이인 체크 (신규 예약만) ──────────────────────────────────────
  if(!editId && name && phone) {
    const phoneDigits = phone.replace(/[^0-9]/g,'');
    // 같은 이름인데 전화번호가 다른 기존 고객이 있는지 확인
    const sameNameDiffPhone = bookings.filter(b =>
      !b._phonePlaceholder &&
      b.name === name &&
      b.phone &&
      b.phone.replace(/[^0-9]/g,'') !== phoneDigits
    );
    if(sameNameDiffPhone.length > 0) {
      const existPhone = sameNameDiffPhone[0].phone;
      const choice = confirm(
        `⚠️ 동명이인 확인\n\n` +
        `"${name}" 이름의 고객이 이미 있어요.\n` +
        `기존 고객 전화번호: ${existPhone}\n` +
        `새 고객 전화번호: ${phone}\n\n` +
        `[확인] → 같은 고객 (기존 카드에 추가)\n` +
        `[취소] → 다른 사람 ("${name} (2)"로 새 등록)`
      );
      if(!choice) {
        // 다른 사람 → 이름 뒤에 번호 붙이기
        const sameNames = [...new Set(bookings.map(b=>b.name))].filter(n => n===name || n.match(new RegExp('^'+name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*\\(\\d+\\)$')));
        document.getElementById('f-name').value = name + ' (' + (sameNames.length + 1) + ')';
        // 모달 닫지 않고 이름 변경 후 사용자가 다시 저장하게
        alert('"' + name + ' (' + (sameNames.length + 1) + ')"으로 이름이 변경되었습니다.\n확인 후 다시 저장해주세요.');
        return;
      }
      // 같은 사람이면 그냥 진행
    }
  }
  // ───────────────────────────────────────────────────────────────────

  // 가족사진 시간 중복 체크 (증명사진 제외, 날짜미정 제외)
  if(product !== 'id' && !dateTbd && date) {
    const conflict = bookings.find(x =>
      x.id !== editId &&
      !x.cancelled &&
      !x.dateTbd &&
      x.date === date &&
      x.time === time &&
      x.product !== 'id'
    );
    if(conflict) {
      if(!confirm('⚠️ ' + fmtDateKo(date) + ' ' + time + '에 이미 "' + conflict.name + '"님 예약이 있습니다.\n그래도 추가하시겠습니까?')) return;
    }
  }
  if(editId) {
    const b = bookings.find(x=>x.id===editId);
    if(b) {
      const priceChanged = b.product!==product || Number(b.adults)!==adults || Number(b.kids)!==kids || !!b.pet!==pet || !!b.weekend!==weekend
        || (product==='id' && (b.idType!==idType || !!b.idWebFile!==idWebFile || !!b.idPassportAdd!==idPassportAdd || !!b.idIdCardAdd!==idIdCardAdd));
      Object.assign(b, {name,phone,email,familyNames,product,adults,kids,childName,date,time,hasKids,pet,weekend,postponedDate,snsConsent,idType,idWebFile,idPassportAdd,idIdCardAdd,dateTbd});
      if(product==='growth') { b.contractYears=contractYears; b.contractYear=contractYear; }
      if(priceChanged) { delete b.priceItems; delete b.payments; }
    }
  } else {
    const newId = genId();
    const contractId = product==='growth' && contractYear===1 ? 'cid_'+newId : undefined;
    bookings.push({id:newId,name,phone,email,familyNames,product,adults,kids,childName,date,time,hasKids,pet,weekend,postponedDate,snsConsent,idType,idWebFile,idPassportAdd,idIdCardAdd,currentStage:0,stageChecks:{},dateTbd,contractYears,contractYear,contractId});
  }
  // ── 전화번호로 상담 기록 통합 ──────────────────────────────────────
  // 신규 예약 저장 시: 같은 전화번호의 _phonePlaceholder 고객이 있으면
  // 그 기록을 현재 이름으로 이전하고 placeholder 삭제
  if(!editId && phone) {
    const phoneDigits = phone.replace(/[^0-9]/g,'');
    const matched = bookings.filter(b =>
      b._phonePlaceholder &&
      b.name !== name &&
      b.phone && b.phone.replace(/[^0-9]/g,'') === phoneDigits
    );
    if(matched.length > 0) {
      matched.forEach(old => {
        // 메모 이전
        if(custMemos[old.name]) {
          custMemos[name] = (custMemos[name] ? custMemos[name] + '\n' : '') + custMemos[old.name];
          delete custMemos[old.name];
          saveCustMemos();
        }
        // 활동 로그 이전
        if(custLogs[old.name]) {
          custLogs[name] = [...(custLogs[name]||[]), ...custLogs[old.name]];
          delete custLogs[old.name];
          saveCustLogs();
        }
        // 상담 예약 자체를 이름만 바꿔서 유지 (기록 남김)
        old.name = name;
        old.phone = phone;
      });
      saveBookings();
    }
  }
  // ───────────────────────────────────────────────────────────────────
  addCustomer(name);
  // 자동 활동 로그
  if(!editId) {
    const newB = bookings[bookings.length-1];
    const pName = (PRODUCTS[product]||PRODUCTS.story).name;
    const yearTag = product==='growth'&&contractYear ? ` ${contractYear}년차` : '';
    const dateTag = dateTbd ? '(날짜 미정)' : `${fmtDateKo(date)} ${time}`;
    addCustLog(name, `예약 등록 — ${pName}${yearTag} ${dateTag}`);
  }
  saveBookings();
  closeAddModal();
  // 캘린더 뷰면 저장한 날짜로 캘린더 이동
  if(false && date) { // 주간 뷰 제거됨
    const d = new Date(date);
    calYear = d.getFullYear();
    calMonth = d.getMonth();
    selectedCalDate = date;
  }
  if(editId) {
    // 수정: 해당 예약 워크플로우로 이동
    const b = bookings.find(x=>x.id===editId);
    if(b) {
      selectedId = editId;
      renderAll();
      if(currentView === 'month') renderMonthCal();
      renderWorkflow(b);
      // wf-modal에서 수정을 열었다면 저장 후 wf-modal 재오픈
      if(_editFromWfModalBid) {
        _editFromWfModalBid = '';
        openWfModal(b);
      }
    }
  } else {
    // 신규 추가: 방금 추가한 예약으로 바로 이동
    const newB = bookings[bookings.length-1];
    if(newB) {
      selectedId = newB.id;
      if(currentView==='cust') openCustGroups[newB.name] = true;
      renderAll();
      // 월간 뷰면 캘린더도 즉시 갱신 + 날짜 셀/항목 깜빡임
      if(currentView === 'month') {
        renderMonthCal();
        setTimeout(()=>{
          const ds = newB.date;
          // 날짜 셀 깜빡임
          const cellEl = document.querySelector(`.mc-cell[data-ds="${ds}"]`);
          if(cellEl) {
            let count = 0;
            const iv = setInterval(()=>{
              cellEl.style.background = count%2===0 ? '#e0e7ff' : '';
              count++;
              if(count >= 6) { clearInterval(iv); cellEl.style.background=''; }
            }, 200);
          }
          // 예약 항목 깜빡임
          const entryEl = document.querySelector(`.mc-entry[onclick*="${newB.id}"]`);
          if(entryEl) {
            let count = 0;
            const iv = setInterval(()=>{
              entryEl.style.opacity = count%2===0 ? '0.15' : '1';
              count++;
              if(count >= 6) { clearInterval(iv); entryEl.style.opacity='1'; }
            }, 200);
          }
        }, 50);
      } else {
        renderWorkflow(newB);
        const right = document.getElementById('right');
        if(right) right.scrollTop = 0;
      }
    } else {
      renderAll();
    }
  }
}

function toggleReview(e, id) {
  e.stopPropagation();
  const b = bookings.find(x=>x.id===id);
  if(!b) return;
  b.reviewed = !b.reviewed;
  // 5단계 체크리스트(고객 리뷰 확인)도 함께 연동
  if(!b.stageChecks) b.stageChecks={};
  if(!b.stageChecks[4]) b.stageChecks[4]={};
  b.stageChecks[4][0] = b.reviewed;
  saveBookings();
  // 별 버튼 업데이트
  const btn = e.currentTarget;
  btn.classList.toggle('reviewed', b.reviewed);
  btn.textContent = b.reviewed ? '⭐' : '☆';
  btn.title = b.reviewed ? '리뷰 완료' : '리뷰 미완료';
  // 오른쪽 체크박스도 즉시 업데이트
  const clEl = document.querySelector(`.cl-item[data-bid="${id}"][data-stage="4"][data-idx="0"]`);
  if(clEl) {
    clEl.classList.toggle('checked', b.reviewed);
    clEl.querySelector('.cl-cb').textContent = b.reviewed ? '✓' : '';
  }
  // 8단계 출고 목록에서 포켓 사진 실시간 갱신
  const shipBox = document.getElementById(`shipping-box-${id}`);
  if(shipBox) {
    const newHtml = buildShippingBox(b);
    if(newHtml) shipBox.outerHTML = newHtml;
  }
}

  renderList();

// ====================== 월간 캘린더 ======================

function renderMonthCal() {
  const mc = document.getElementById('month-cal');
  if(!mc) return;
  const today = new Date().toISOString().slice(0,10);
  const y = mcYear, m = mcMonth;
  const monthLabel = `${y}년 ${m+1}월`;

  // 이번 달 예약 모으기
  const byDate = {};
  bookings.forEach(b => {
    if(b.dateTbd) return; // 날짜 미정은 캘린더에 표시 안 함
    const isPostponed = !!b.postponed && !b.cancelled;
    if(!byDate[b.date]) byDate[b.date] = [];
    byDate[b.date].push({...b, _mcType: b.cancelled ? 'cancelled' : isPostponed ? 'postponed_orig' : 'normal'});
    if(isPostponed && b.postponedDate) {
      if(!byDate[b.postponedDate]) byDate[b.postponedDate] = [];
      byDate[b.postponedDate].push({...b, _mcType: 'postponed_new'});
    }
  });

  // 그리드 셀 생성 (일요일 시작)
  const firstDow = new Date(y, m, 1).getDay(); // 0=일
  const startOffset = firstDow; // 일=0
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const daysInPrev  = new Date(y, m,   0).getDate();

  const cells = [];
  // 이전달 채우기
  for(let i = startOffset-1; i >= 0; i--) {
    const d = daysInPrev - i;
    const mm = m === 0 ? 12 : m;
    const yy = m === 0 ? y-1 : y;
    cells.push({ds:`${yy}-${String(mm).padStart(2,'0')}-${String(d).padStart(2,'0')}`, day:d, thisMonth:false});
  }
  // 이번 달
  for(let d = 1; d <= daysInMonth; d++) {
    cells.push({ds:`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`, day:d, thisMonth:true});
  }
  // 다음달 채우기 (6줄 고정)
  const totalCells = Math.ceil(cells.length / 7) * 7;
  let nd = 1;
  while(cells.length < totalCells) {
    const mm = m === 11 ? 1 : m+2;
    const yy = m === 11 ? y+1 : y;
    cells.push({ds:`${yy}-${String(mm).padStart(2,'0')}-${String(nd).padStart(2,'0')}`, day:nd++, thisMonth:false});
  }

  const DOWS = ['일','월','화','수','목','금','토'];
  const dowHtml = DOWS.map((d,i)=>
    `<div class="mc-dow${i===0?' sun':i===6?' sat':''}">${d}</div>`
  ).join('');

  const cellsHtml = cells.map((cell, idx) => {
    const dow = idx % 7; // 0=일 6=토
    const isToday = cell.ds === today;
    const bks = (byDate[cell.ds]||[]).sort((a,b)=>a.time.localeCompare(b.time));
    const memo = dateMemos[cell.ds] || '';

    // 인라인 메모 textarea (항상 표시)
    const memoHtml = cell.thisMonth
      ? `<textarea class="mc-memo-ta${memo?' has-memo':''}" rows="2"
          placeholder="메모..."
          onchange="mcSaveMemo('${cell.ds}',this.value)"
          oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px';if(this.value.trim()!==this.dataset.saved)this.classList.add('has-memo');else this.classList.toggle('has-memo',!!this.value.trim())"
          data-saved="${escHtml(memo)}"
          onclick="event.stopPropagation()"
        >${escHtml(memo)}</textarea>`
      : '';

    const MC_PROD = {story:'스토리',simpfam:'심플패밀리',bigfam:'대가족',growth:'성장',kids:'키즈',profile:'프로필',jangsu:'장수',id:'증명'};

    const entriesHtml = bks.map(b => {
      const p = PRODUCTS[b.product] || PRODUCTS.story;
      const mcType = b._mcType || 'normal';
      const isCancelledMc = mcType === 'cancelled';
      const isPostponedOrig = mcType === 'postponed_orig'; // 원래 날짜 (연기됨)
      const isPostponedNew  = mcType === 'postponed_new';  // 연기된 새 날짜
      const unpaidDot = isUnpaid(b) ? `<span style="width:6px;height:6px;background:#dc2626;border-radius:50%;flex-shrink:0;display:inline-block"></span>` : '';
      const shortProd = MC_PROD[b.product] || p.name;
      const a = parseInt(b.adults)||0, k = parseInt(b.kids)||0, t = a+k;
      const tStr = t > 0 ? `${t}명` : '';
      const visitN = b.visitNote ? escHtml(b.visitNote) : '';

      // 취소
      if(isCancelledMc) {
        return `<div class="mc-entry" style="border-left-color:#9ca3af;opacity:0.55" onclick="mcSelectBooking('${b.id}')">
          <span class="mc-entry-time" style="color:#9ca3af">${fmtTime(b.time)}</span>
          <span class="mc-entry-name" style="color:#9ca3af;text-decoration:line-through">${escHtml(b.name)}-${shortProd}</span>
          <span style="font-size:9px;background:#9ca3af;color:#fff;border-radius:2px;padding:0 3px;flex-shrink:0">취소</span>
        </div>`;
      }
      // 연기(원래날짜)
      if(isPostponedOrig) {
        return `<div class="mc-entry" style="border-left-color:#f97316;opacity:0.65" onclick="mcSelectBooking('${b.id}')">
          <span class="mc-entry-time" style="color:#c2410c">${fmtTime(b.time)}</span>
          <span class="mc-entry-name" style="color:#c2410c;text-decoration:line-through">${escHtml(b.name)}-${shortProd}</span>
          <span style="font-size:9px;background:#f97316;color:#fff;border-radius:2px;padding:0 3px;flex-shrink:0">연기</span>
        </div>`;
      }
      // 연기(새날짜)
      if(isPostponedNew) {
        return `<div class="mc-entry" style="border-left-color:#f97316" onclick="mcSelectBooking('${b.id}')">
          <span class="mc-entry-time" style="color:#c2410c">${fmtTime(b.time)}</span>
          <span class="mc-entry-name" style="color:#c2410c">${escHtml(b.name)}-${shortProd}${visitN?` <span style="opacity:.75">${visitN}</span>`:''}</span>
          <span style="font-size:9px;background:#f97316;color:#fff;border-radius:2px;padding:0 3px;flex-shrink:0">연기됨</span>
        </div>`;
      }
      // 전화 문의 고객 (상담 표시 — 빨간색)
      if(b._phonePlaceholder) {
        return `<div class="mc-entry" style="border-left-color:#dc2626;background:#fff5f5" onclick="mcSelectBooking('${b.id}')">
          <span class="mc-entry-time" style="color:#dc2626">${fmtTime(b.time)}</span>
          <span class="mc-entry-name" style="color:#dc2626;font-weight:700">${escHtml(b.name)}</span>
          <span style="font-size:9px;background:#dc2626;color:#fff;border-radius:2px;padding:0 4px;flex-shrink:0;font-weight:700">상담</span>
        </div>`;
      }
      // 일반
      // 상품별 기본 색상: 가족사진=초록, 증명=파란, 취소=회색, 연기=주황
      const baseColor = b.cancelled ? '#9ca3af'
        : b.postponed ? '#f97316'
        : b.product === 'id' ? '#3b82f6'   // 증명사진 → 파란색
        : '#16a34a';                         // 가족사진 전체 → 초록색
      const unpaidMc = isUnpaid(b);
      const {label: stLabel, color: stColor} = getDynamicStatusLabel(b);
      // 특수 상태 배지 (예약 접수는 숨김)
      const hideLabel = ['예약 접수','예약 확정',''].includes(stLabel);
      const statusBadgeMc = !hideLabel
        ? `<span style="font-size:9px;background:${stColor};color:#fff;border-radius:2px;padding:0 4px;flex-shrink:0;font-weight:700">${stLabel}</span>`
        : '';
      // 색상: 미입금/상담/취소/연기/모니터/완료는 상태 색상, 나머지는 상품 색상
      const specialStates = ['미입금','상담','모니터','작업중','완료'];
      const entryColor = b.cancelled ? '#9ca3af'
        : b.postponed ? '#f97316'
        : unpaidMc ? '#dc2626'
        : specialStates.includes(stLabel) ? stColor
        : baseColor;
      const entryBg = b.cancelled ? '#f9fafb'
        : b.postponed ? '#fff7ed'
        : unpaidMc ? '#fff5f5'
        : stLabel==='모니터' ? '#fffbeb'
        : stLabel==='완료' ? '#f0fdf4'
        : '';
      return `<div class="mc-entry" style="border-left-color:${entryColor};background:${entryBg}" onclick="mcSelectBooking('${b.id}')">
        <span class="mc-entry-time" style="color:${entryColor}">${fmtTime(b.time)}</span>
        <span class="mc-entry-name" style="color:${entryColor}">${escHtml(b.name)}-${shortProd}${visitN?` <span style="opacity:.75">${visitN}</span>`:''}</span>
        ${statusBadgeMc}
      </div>`;

    }).join('');

    const cls = [
      'mc-cell',
      isToday ? 'mc-today' : '',
      !cell.thisMonth ? 'mc-other' : '',
      dow===6 ? 'mc-sat' : '',
      dow===0 ? 'mc-sun' : ''
    ].filter(Boolean).join(' ');

    return `<div class="${cls}" data-ds="${cell.ds}">
      <div class="mc-dnum">
        ${isToday ? `<span class="mc-today-dot">${cell.day}</span>` : cell.day}
      </div>
      ${memoHtml}
      ${entriesHtml}
      ${cell.thisMonth ? `<button class="mc-add-btn" onclick="openAddModalForDate('${cell.ds}')">＋ 예약 추가</button>` : ''}
    </div>`;
  }).join('');

  mc.innerHTML = `
    <div class="mc-nav">
      <button class="mc-nav-btn" onclick="mcPrevMonth()">‹</button>
      <div class="mc-title">${monthLabel}</div>
      <button class="mc-nav-btn" onclick="mcNextMonth()">›</button>
      <button class="mc-today-btn" onclick="mcGoToday()">오늘</button>
      <div style="flex:1"></div>
      <button onclick="openCustSearchPopup()" style="background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:6px 14px;font-size:12px;cursor:pointer;font-weight:600">👤 고객 검색</button>
      <button onclick="openAddModal()" style="background:#6366f1;color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:12px;cursor:pointer;font-weight:700">＋ 예약 추가</button>
    </div>
    <div class="mc-grid-wrap">
      <div class="mc-grid">
        ${dowHtml}
        ${cellsHtml}
      </div>
    </div>
  `;
  // 렌더 직후 메모 textarea 높이 자동 조정
  requestAnimationFrame(()=>{
    mc.querySelectorAll('.mc-memo-ta').forEach(ta=>{
      ta.style.height = 'auto';
      ta.style.height = ta.scrollHeight + 'px';
    });
  });
}

function mcPrevMonth() {
  mcMonth--; if(mcMonth < 0) { mcMonth = 11; mcYear--; }
  renderMonthCal();
}
function mcNextMonth() {
  mcMonth++; if(mcMonth > 11) { mcMonth = 0; mcYear++; }
  renderMonthCal();
}
function mcGoToday() {
  const t = new Date(); mcYear = t.getFullYear(); mcMonth = t.getMonth();
  renderMonthCal();
}

// 월간에서 예약 클릭 → 고객카드(고객별 보기)로 이동
function mcSelectBooking(bid) {
  const b = bookings.find(x=>x.id===bid);
  if(!b) return;
  // 고객별 보기로 전환 (selectCustFromPopup 사용 — 안전한 뷰 전환)
  selectCustFromPopup(b.name);
  // 해당 방문 카드로 스크롤 + 펼침 + 반짝임 (showCustDetail 50ms 후 실행되므로 200ms 대기)
  setTimeout(()=>{
    const el = document.getElementById('hist-card-'+bid);
    if(!el) return;
    // 카드 펼치기
    const detail = document.getElementById('hist-detail-'+bid);
    const chev   = document.getElementById('hist-chev-'+bid);

// ====================== 사진 관리 (IndexedDB + Google Drive 썸네일) ======================
let photoDB = null;
let photoCache = {}; // custName → [{id, custName, thumb, full, filename, uploadedAt, driveId}]
let lightboxPhotos = [];
let lightboxIdx = 0;

// ── Drive 썸네일 연동 ──
// GAS_URL 을 공유: action='savePhoto' / 'deletePhoto' / 'listPhotos'
async function driveUploadThumb(custName, thumbDataUrl, filename, localId, bookingId) {
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain'},
      body: JSON.stringify({
        action: 'savePhoto',
        custName,
        filename,
        localId: String(localId),
        bookingId: bookingId || '',
        thumbData: thumbDataUrl
      })
    });
    const json = await res.json();
    if(json.ok && json.driveId) {
      if(photoDB) {
        const tx = photoDB.transaction('photos','readwrite');
        const store = tx.objectStore('photos');
        const req = store.get(Number(localId));
        req.onsuccess = () => {
          const rec = req.result;
          if(rec) { rec.driveId = json.driveId; store.put(rec); }
        };
      }
      const arr = photoCache[custName] || [];
      const p = arr.find(x => x.id === Number(localId));
      if(p) p.driveId = json.driveId;
    }
  } catch(e) { /* 오프라인 → 로컬만 저장 */ }
}

async function driveDeleteThumb(driveFileId) {
  if (!driveFileId) return;
  try {
    await fetch(GAS_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain'},
      body: JSON.stringify({ action: 'deletePhoto', driveFileId })
    });
  } catch(e) {}
}
// ── Drive 연동 끝 ──

function initPhotoDB() {
  return new Promise((resolve) => {
    const req = indexedDB.open('gamtan_photos_db', 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if(!db.objectStoreNames.contains('photos')) {
        const store = db.createObjectStore('photos', {keyPath:'id', autoIncrement:true});
        store.createIndex('custName','custName',{unique:false});
      }
    };
    req.onsuccess = e => {
      photoDB = e.target.result;
      loadAllPhotosToCache().then(()=>{ renderList(); resolve(); });
    };
    req.onerror = () => resolve();
  });
}

function loadAllPhotosToCache() {
  return new Promise(resolve => {
    if(!photoDB) { resolve(); return; }
    const req = photoDB.transaction('photos','readonly').objectStore('photos').getAll();
    req.onsuccess = () => {
      photoCache = {};
      (req.result||[]).forEach(p => {
        if(!photoCache[p.custName]) photoCache[p.custName] = [];
        photoCache[p.custName].push(p);
      });
      resolve();
    };
    req.onerror = () => resolve();
  });
}

function savePhotoToDB(custName, thumb, full, filename, bookingId) {
  return new Promise((resolve, reject) => {
    if(!photoDB) { reject('DB not ready'); return; }
    const record = {custName, thumb, full, filename, uploadedAt: Date.now(), bookingId: bookingId||null, driveId: null};
    const req = photoDB.transaction('photos','readwrite').objectStore('photos').add(record);
    req.onsuccess = () => {
      record.id = req.result;
      if(!photoCache[custName]) photoCache[custName] = [];
      photoCache[custName].push(record);
      // Drive에 썸네일 비동기 업로드 (실패해도 로컬은 유지)
      driveUploadThumb(custName, thumb, filename, record.id, bookingId||'');
      resolve(record);
    };
    req.onerror = () => reject(req.error);
  });
}

function deletePhotoFromDB(custName, photoId) {
  return new Promise(resolve => {
    if(!photoDB) { resolve(); return; }
    // Drive 삭제 (driveId 있을 때만)
    const photo = (photoCache[custName]||[]).find(p=>p.id===photoId);
    if(photo && photo.driveId) driveDeleteThumb(photo.driveId);
    const tx = photoDB.transaction('photos','readwrite');
    tx.objectStore('photos').delete(photoId);
    tx.oncomplete = () => {
      if(photoCache[custName]) photoCache[custName] = photoCache[custName].filter(p=>p.id!==photoId);
      resolve();
    };
    tx.onerror = () => resolve();
  });
}

function resizeImage(file, maxW, maxH, quality) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxW || h > maxH) {
          const r = Math.min(maxW/w, maxH/h);
          w = Math.round(w*r); h = Math.round(h*r);
        }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function handlePhotoFiles(custName, files, bookingId) {
  const arr = Array.from(files).filter(f => f.type.startsWith('image/'));
  if(!arr.length) return;
  for(const file of arr) {
    try {
      const [thumb, full] = await Promise.all([
        resizeImage(file, 160, 160, 0.8),
        resizeImage(file, 1400, 1400, 0.88)
      ]);
      await savePhotoToDB(custName, thumb, full, file.name, bookingId||null);
    } catch(e) { console.error('사진 저장 오류:', e); }
  }
  // 워크플로우 사진 섹션 갱신
  const psEl = document.getElementById('photo-section-wf');
  if(psEl) psEl.outerHTML = buildPhotoSection(custName, bookingId);
  // 고객 목록 썸네일 갱신
  const enc = encodeURIComponent(custName);
  const thumbEl = document.getElementById('cust-thumbs-'+enc);
  if(thumbEl) thumbEl.outerHTML = buildCustThumbs(custName, enc);
  // 고객카드 사진 갱신
  const cpEl = document.getElementById('cust-photo-section-'+enc);
  if(cpEl) cpEl.outerHTML = buildCustPhotoSection(custName);
  // 히스토리 카드 사진 섹션 갱신 (bookingId가 있는 경우 해당 카드만, 없으면 전체)
  if(bookingId) {
    refreshHistCardPhotos(custName, bookingId);
  } else {
    const allBks = bookings.filter(b=>b.name===custName);
    allBks.forEach(b => refreshHistCardPhotos(custName, b.id));
  }
}

// 라이트박스
function openLightbox(custName, idx) {
  lightboxPhotos = photoCache[custName] || [];
  lightboxIdx = Math.max(0, Math.min(idx, lightboxPhotos.length-1));
  showLightboxPhoto();
  document.getElementById('lightbox-modal').classList.add('open');
}
function showLightboxPhoto() {
  const p = lightboxPhotos[lightboxIdx];
  if(!p) return;
  document.getElementById('lightbox-img').src = p.full || p.thumb;
  document.getElementById('lightbox-name').textContent = p.filename || '';
  document.getElementById('lightbox-counter').textContent =
    lightboxPhotos.length > 1 ? `${lightboxIdx+1} / ${lightboxPhotos.length}` : '';
  const show = lightboxPhotos.length > 1;
  document.getElementById('lightbox-prev').style.display = show ? 'flex' : 'none';
  document.getElementById('lightbox-next').style.display = show ? 'flex' : 'none';
}
function lightboxPrev() {
  lightboxIdx = (lightboxIdx - 1 + lightboxPhotos.length) % lightboxPhotos.length;
  showLightboxPhoto();
}
function lightboxNext() {
  lightboxIdx = (lightboxIdx + 1) % lightboxPhotos.length;
  showLightboxPhoto();
}
function closeLightbox() {
  document.getElementById('lightbox-modal').classList.remove('open');
}
document.addEventListener('keydown', e => {
  if(e.key==='Escape') {
    if(document.getElementById('cust-search-popup').style.display!=='none') { closeCustSearchPopup(); return; }
    if(document.getElementById('gsearch-modal').classList.contains('open')) { closeGSearch(); return; }
    if(document.getElementById('lightbox-modal').classList.contains('open')) { closeLightbox(); return; }
  }
  if(!document.getElementById('lightbox-modal').classList.contains('open')) return;
  if(e.key==='ArrowLeft')  { e.preventDefault(); lightboxPrev(); }
  if(e.key==='ArrowRight') { e.preventDefault(); lightboxNext(); }
});
document.getElementById('lightbox-modal').addEventListener('click', function(e) {
  if(e.target === this) closeLightbox();
});

function updateAligoMsgInfo() {

  const bytes = [...txt].reduce((n,c)=>n+(c.charCodeAt(0)>127?2:1),0);

// 실제 발송
async function aligoSend() {
  const s = loadAligoSettings();
  if(!s.userId || !s.apiKey || !s.sender) {
    if(confirm('알리고 설정이 없습니다. 지금 설정하시겠어요?')) {
      closeAligoSend();
      openAligoSettings();
    }
    return;
  }
  const receiver = document.getElementById('aligo-recv').value.trim();
  const msg      = document.getElementById('aligo-msg').value.trim();
  if(!receiver) { alert('수신번호를 입력해 주세요.'); return; }
  if(!msg)      { alert('메시지를 입력해 주세요.'); return; }

  const btn = document.getElementById('aligo-send-btn');
  const resEl = document.getElementById('aligo-send-result');
  btn.disabled = true;
  btn.textContent = '발송 중...';
  resEl.style.color = '#888';
  resEl.textContent = '발송 요청 중...';

  try {
    const txt = document.getElementById('aligo-msg').value;
    const bytes = [...txt].reduce((n,c)=>n+(c.charCodeAt(0)>127?2:1),0);
    const fd = new FormData();
    fd.append('key',      s.apiKey);
    fd.append('user_id',  s.userId);
    fd.append('sender',   s.sender.replace(/-/g,''));
    fd.append('receiver', receiver.replace(/-/g,''));
    fd.append('msg',      msg);
    if(bytes > 90) fd.append('msg_type', 'LMS');
    const res = await fetch('https://apis.aligo.in/send/', { method:'POST', body:fd });
    const data = await res.json();
    if(data.result_code === '1') {
      resEl.style.color = '#16a34a';
      resEl.textContent = `✅ 발송 완료! (${data.msg_type}, 잔여 ${data.SMS_CNT||data.LMS_CNT}건)`;
      btn.textContent = '발송 완료';
      setTimeout(()=>closeAligoSend(), 1800);
    } else {
      resEl.style.color = '#dc2626';
      resEl.textContent = `발송 실패: ${data.message}`;
      btn.disabled = false;
      btn.textContent = '다시 시도';
    }
  } catch(e) {
    // CORS 차단 시 fallback 안내
    resEl.style.color = '#b45309';
    resEl.innerHTML = `⚠️ 직접 발송 불가 (CORS 차단)<br>
      <a href="https://sms.aligo.in" target="_blank" style="color:#6366f1;font-weight:600">알리고 웹에서 직접 발송 →</a>`;
    btn.disabled = false;
    btn.textContent = '다시 시도';
  }
}

// 히스토리 카드 접기/펼치기
function cancelBooking(bid, custName) {
  if(!confirm('이 예약을 취소하시겠습니까?\n취소 후에도 기록은 유지됩니다.')) return;
  const b = bookings.find(x=>x.id===bid);
  if(!b) return;
  b.cancelled = true;
  b.cancelledAt = new Date().toISOString().slice(0,10);
  saveBookings();
  addCustLog(custName, `예약 취소 — ${fmtDateKo(b.date)} ${fmtTime(b.time)} ${(PRODUCTS[b.product]||PRODUCTS.story).name}`);
  showCustDetail(custName);
}
function uncancelBooking(bid, custName) {
  const b = bookings.find(x=>x.id===bid);
  if(!b) return;
  b.cancelled = false;
  b.cancelledAt = '';
  saveBookings();
  addCustLog(custName, `예약 취소 해제 — ${fmtDateKo(b.date)} ${fmtTime(b.time)}`);
  showCustDetail(custName);
}

// ── 연기 기능 ──
function openPostponeModal(bid, custName) {
  const b = bookings.find(x=>x.id===bid);
  if(!b) return;
  document.getElementById('postpone-modal-bid').value = bid;
  document.getElementById('postpone-modal-custname').value = custName;
  document.getElementById('postpone-modal-orig-date').textContent = fmtDateKo(b.date);
  document.getElementById('postpone-modal-new-date').value = b.postponedDate || '';
  document.getElementById('postpone-modal').style.display = 'flex';
}
function closePostponeModal() {
  document.getElementById('postpone-modal').style.display = 'none';
}
function confirmPostpone() {
  const bid = document.getElementById('postpone-modal-bid').value;
  const custName = document.getElementById('postpone-modal-custname').value;
  const newDate = document.getElementById('postpone-modal-new-date').value;
  // 날짜 없이도 연기 가능 (날짜 미정)
  const b = bookings.find(x=>x.id===bid);
  if(!b) return;
  b.postponed = true;
  b.postponedAt = new Date().toISOString().slice(0,10);
  b.postponedDate = newDate || ''; // 날짜 있으면 저장, 없으면 빈 문자열
  // b.date는 원래 날짜 유지 (이동 안 함)
  saveBookings();
  const logMsg = newDate
    ? '예약 연기 — ' + fmtDateKo(b.date) + ' → 예정: ' + fmtDateKo(newDate)
    : '예약 연기 — ' + fmtDateKo(b.date) + ' (날짜 미정)';
  addCustLog(custName, logMsg);
  closePostponeModal();
  showCustDetail(custName);
}
function unpostponeBooking(bid, custName) {
  const b = bookings.find(x=>x.id===bid);
  if(!b) return;
  b.postponed = false;
  b.postponedAt = '';
  b.postponedDate = '';
  saveBookings();
  addCustLog(custName, '연기 해제 — ' + fmtDateKo(b.date) + '로 복원');
  showCustDetail(custName);
}

// ─── 가족성장 계약 함수들 ──────────────────────────────────────────
// 다음 연도 예약 추가
function addNextYearBooking(bid, custName) {
  const b = bookings.find(x=>x.id===bid);
  if(!b) return;
  const curYr = b.contractYear||1;
  const totalYrs = b.contractYears||5;
  if(curYr >= totalYrs) { alert('이미 마지막 년차입니다.'); return; }
  const nextYr = curYr + 1;
  // 이미 다음 연도 예약이 있는지 체크
  const exists = b.contractId && bookings.some(x=>x.contractId===b.contractId && (x.contractYear||1)===nextYr && !x.cancelled);
  if(exists) { alert(`${nextYr}년차 예약이 이미 있습니다.`); return; }
  const newId = Date.now().toString();
  const newBooking = {
    id: newId,
    name: b.name,
    phone: b.phone,
    email: b.email||'',
    product: 'growth',
    date: '',
    time: b.time||'',
    memo: '',
    currentStage: 0,
    stageChecks: {},
    priceItems: JSON.parse(JSON.stringify(b.priceItems||[])),
    extraCharges: [],
    extraItems: {},
    dateTbd: true,
    contractYears: totalYrs,
    contractYear: nextYr,
    contractId: b.contractId,
    familyNames: b.familyNames||'',
    createdAt: new Date().toLocaleDateString('ko-KR')
  };
  bookings.push(newBooking);
  saveBookings();
  addCustLog(custName, `가족성장 ${nextYr}년차 예약 추가 (날짜 미정)`);
  showCustDetail(custName);
  alert(`${nextYr}년차 예약이 추가되었습니다.\n날짜는 확정 후 수정해 주세요.`);
}

// 계약 기간 변경 (5년 ↔ 10년)
function openChangeContractYears(bid, custName) {
  const b = bookings.find(x=>x.id===bid);
  if(!b) return;
  const cur = b.contractYears||5;
  const newVal = prompt(`계약 기간을 입력해주세요.\n현재: ${cur}년\n(예: 5 또는 10)`, cur);
  if(!newVal) return;
  const parsed = parseInt(newVal);
  if(isNaN(parsed)||parsed<1||parsed>20) { alert('1~20 사이의 숫자를 입력해주세요.'); return; }
  if(parsed===cur) return;
  // 같은 contractId를 가진 모든 예약의 contractYears 업데이트
  if(b.contractId) {
    bookings.forEach(x=>{ if(x.contractId===b.contractId) x.contractYears = parsed; });
  } else {
    b.contractYears = parsed;
  }
  saveBookings();
  addCustLog(custName, `가족성장 계약 기간 변경: ${cur}년 → ${parsed}년`);
  showCustDetail(custName);
}

function moveToPostponedDate(bid, custName) {
  const b = bookings.find(x=>x.id===bid);
  if(!b || !b.postponedDate) return;
  const oldDate = b.date;
  const newDate = b.postponedDate;
  b.date = newDate;
  b.postponed = false;
  b.postponedAt = '';
  b.postponedDate = '';
  saveBookings();
  addCustLog(custName, '연기 날짜 확정 이동 — ' + fmtDateKo(oldDate) + ' → ' + fmtDateKo(newDate));
  showCustDetail(custName);
}

function toggleHistDetail(bid) {
  const detail = document.getElementById('hist-detail-'+bid);
  const chev   = document.getElementById('hist-chev-'+bid);
  const card   = document.getElementById('hist-card-'+bid);
  if(!detail) return;
  const b = bookings.find(x=>x.id===bid);
  const done = b && (b.product==='id' ? (b.currentStage||0)>=2 : (b.currentStage||0)>=8);
  const isOpen = detail.style.display !== 'none';
  detail.style.display = isOpen ? 'none' : 'block';
  if(chev) chev.textContent = isOpen ? '▼' : '▲';
  // 펼침=보라/접힘=회색  (완료=초록, 취소=회색, 연기=주황 고정)
  const cancelled = b && !!b.cancelled;
  const postponed = b && !!b.postponed;
  const dateTbd   = b && !!b.dateTbd;
  if(card) card.style.borderColor = cancelled ? '#d1d5db' : postponed ? '#fed7aa' : dateTbd ? '#f9a8d4' : done ? '#059669' : (!isOpen ? '#6366f1' : '#e5e7eb');
  // 펼침 상태 localStorage 저장
  saveOpenHistCards();
}

// 현재 펼쳐진 히스토리 카드 bid 목록을 localStorage에 저장
function saveOpenHistCards() {
  const openBids = [];
  document.querySelectorAll('[id^="hist-detail-"]').forEach(el => {
    if(el.style.display !== 'none') {
      const bid = el.id.replace('hist-detail-', '');
      openBids.push(bid);
    }
  });
  localStorage.setItem('gamtan_open_hist_cards', JSON.stringify(openBids));
}

// 저장된 펼침 상태 복원 (showCustDetail 렌더링 후 호출)
function restoreOpenHistCards() {
  try {
    const saved = localStorage.getItem('gamtan_open_hist_cards');
    if(!saved) return;
    const openBids = JSON.parse(saved);
    openBids.forEach(bid => {
      const detail = document.getElementById('hist-detail-'+bid);
      const chev   = document.getElementById('hist-chev-'+bid);
      const card   = document.getElementById('hist-card-'+bid);
      if(detail && detail.style.display === 'none') {
        detail.style.display = 'block';
        if(chev) chev.textContent = '▲';
        const b = bookings.find(x=>x.id===bid);
        if(b && card) {
          const done = b.product==='id' ? (b.currentStage||0)>=2 : (b.currentStage||0)>=8;
          const cancelled = !!b.cancelled;
          const postponed = !!b.postponed;
          const dateTbd   = !!b.dateTbd;
          card.style.borderColor = cancelled ? '#d1d5db' : postponed ? '#fed7aa' : dateTbd ? '#f9a8d4' : done ? '#059669' : '#6366f1';
        }
      }
    });
  } catch(e) {}
}

// 히스토리에서 추가주문 수량 조절
function histSetExtra(bid, key, delta, custName) {
  const b = bookings.find(x=>x.id===bid);
  if(!b) return;
  if(!b.extraItems) b.extraItems = {};
  const cur = parseInt(b.extraItems[key])||0;
  const next = Math.max(0, cur + delta);
  b.extraItems[key] = next;
  saveBookings();
  // 전체 컨트롤 패널 숫자 셀 업데이트
  const el = document.getElementById('hist-extra-'+bid+'-'+key);
  if(el) {
    el.textContent = next;
    el.style.color = next > 0 ? '#6366f1' : '#ccc';
    el.style.fontWeight = next > 0 ? '700' : '400';
  }
  // 뱃지 요약 행 재구성 (수량 경계 변화 시 뱃지 추가/삭제)
  refreshExtraBadgeRow(bid, custName);
}

function refreshExtraBadgeRow(bid, custName) {

function refreshHistCardHeader(bid) {
  const b = bookings.find(x=>x.id===bid);
  if(!b) return;
  const {label, color} = getDynamicStatusLabel(b);

  // 1. 히스토리 카드 헤더 상태 배지 갱신
  const header = document.querySelector(`#hist-card-${bid} > div:first-child`);
  if(header) {
    const spans = header.querySelectorAll('span[style*="font-weight:700"]');
    spans.forEach(sp => {
      if(sp.style.whiteSpace === 'nowrap' && !sp.style.background) {
        sp.textContent = label;
        sp.style.color = color;
      }
    });
  }

  // 2. hist-amt 요소 갱신 (펼쳐진 경우)
  const amtEl = document.getElementById('hist-amt-' + bid);
  if(amtEl) {
    const safeName = (b.name||'').replace(/'/g,"\'");

  }

  // 3. 왼쪽 목록 카드 미입금 배지 갱신 (subCard 부분)
  // subCard는 bid로 직접 찾을 수 없으므로 renderList로 갱신
  // 단, 현재 펼쳐진 상태를 기억했다가 복원
  const detailEl = document.getElementById('hist-detail-' + bid);

function refreshHistAmt(bid, custName) {
  const b = bookings.find(x=>x.id===bid);
  if(!b) return;
  const safeName = custName.replace(/'/g,"\\'");
  const el = document.getElementById('hist-amt-'+bid);
  if(el) el.innerHTML = buildHistAmtHtml(b, safeName);

// 고객카드 상단 통계(총결제액 등) 부분 갱신
function refreshCustStats(custName) {
  const bks = bookings.filter(b=>b.name===custName);
  const key = custName.replace(/\s/g,'_');
  const totalSpent  = bks.filter(b=>!b.cancelled&&!b.postponed).reduce((s,b)=>s+(b.priceItems?priceTotal(b):0),0);
  const totalVisits = bks.filter(b=>!b.cancelled&&!b.postponed).length;
  const elV = document.getElementById('cust-stat-visits-'+key);
  const elS = document.getElementById('cust-stat-spent-'+key);
  if(elV) elV.textContent = totalVisits+'회';
  if(elS) elS.textContent = totalSpent>0?fmtPrice(totalSpent):'-';
}

// ── 히스토리 카드 금액 섹션 — 읽기 전용 요약 ──────────────────────
function buildHistAmtHtml(b, safeName) {
  initPayments(b);
  const amt    = b.priceItems ? priceTotal(b) : 0;
  const paid   = paidTotal(b);
  const remain = Math.max(0, amt - paid);
  const depAmt      = Number(b.payments?.deposit?.amt||0);
  const midterms    = b.payments?.midterms||[];
  const _unpaid     = isUnpaid(b);
  const depConfirmed = !!(b.stageChecks?.[1]?.[0]) || (b.currentStage||0) >= 2;
  const fullyPaid   = amt > 0 && !_unpaid && remain <= 0;

  if(amt <= 0) return '';  // 가격 미설정 시 아무것도 표시 안 함

  // 상태 배지
  const statusBadge = _unpaid
    ? `<span style="background:#fee2e2;color:#dc2626;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700">⚠️ 미입금</span>`
    : fullyPaid
      ? `<span style="background:#dcfce7;color:#166534;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700">✅ 완납</span>`
      : `<span style="background:#ffedd5;color:#c2410c;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700">💸 미납잔금 ${fmtPrice(remain)}</span>`;

  // 납입 항목 (예약금 + 추가납입)
  const rows = [];
  if(depAmt > 0 || depConfirmed) {
    rows.push(`<span style="font-size:11px;background:${depConfirmed?'#f5f3ff':'#fff8f8'};color:${depConfirmed?'#7c3aed':'#dc2626'};border-radius:5px;padding:2px 8px;font-weight:600">${depConfirmed?'✅ ':''} 예약금 ${fmtPrice(depAmt)}</span>`);
  }
  midterms.forEach((m,i)=>{
    const totalMids = midterms.length;
    const lbl = totalMids === 1 ? '추가납입' : i === totalMids-1 ? '추가납입' : `중도금${totalMids>2?i+1:''}`;
    rows.push(`<span style="font-size:11px;background:#f0fdf4;color:#166534;border-radius:5px;padding:2px 8px;font-weight:600">✅ ${lbl} ${fmtPrice(Number(m.amt))}</span>`);
  });

  const receiptLabelMap = {'card_statement':'카드매출전표','cash_income':'소득공제','cash_expense':'지출증빙','cash_self':'자진발급','tax_invoice':'세금계산서','tax_free':'면세','general':'일반영수증'};
  const receiptBadge = b.cashReceipt
    ? `<span style="font-size:11px;background:#f0fdf4;color:#166534;border-radius:5px;padding:2px 8px">🧾 ${receiptLabelMap[b.cashReceipt]||b.cashReceipt}</span>`
    : '';

  return `<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
    <span style="font-size:13px;font-weight:800;color:#1a1a2e">💰 ${fmtPrice(amt)}</span>
    ${statusBadge}
    ${rows.join('')}
    ${receiptBadge}
  </div>`;
}

// 워크플로우 패널 예약금 입금확인 체크 토글
function toggleDepositConfirm(bid) {
  const b = bookings.find(x=>x.id===bid);
  if(!b) return;
  if(!b.stageChecks) b.stageChecks = {};
  if(!b.stageChecks[1]) b.stageChecks[1] = {};
  const current = !!b.stageChecks[1][0];
  b.stageChecks[1][0] = !current;
  if(!current && (b.currentStage||0) < 1) b.currentStage = 1;
  saveBookings();
  // 체크박스 UI 즉시 갱신
  const confirmed = b.stageChecks[1][0];
  const row = document.getElementById(`dep-confirm-row-${bid}`);
  const cb  = document.getElementById(`dep-confirm-cb-${bid}`);
  const lbl = document.getElementById(`dep-confirm-lbl-${bid}`);
  if(row) row.style.background = confirmed ? '#f0fdf4' : '#fff8f8';
  if(cb) {
    cb.style.border = `2px solid ${confirmed?'#16a34a':'#dc2626'}`;
    cb.style.background = confirmed ? '#16a34a' : '#fff';
    cb.innerHTML = confirmed ? '<span style="color:#fff;font-size:13px;font-weight:900">✓</span>' : '';
  }
  if(lbl) {
    lbl.style.color = confirmed ? '#16a34a' : '#dc2626';
    lbl.textContent = confirmed ? '✅ 예약금 입금 확인됨' : '⚠️ 예약금 미입금 — 클릭하여 확인';
  }
  // 수납 카드·배지·목록 카드 갱신
  updatePriceUI(bid);
  renderList();
}

// 예약금 입금 확인 (원클릭)
function histConfirmDeposit(bid, custName) {
  const b = bookings.find(x=>x.id===bid);
  if(!b) return;
  if(!b.stageChecks) b.stageChecks = {};
  if(!b.stageChecks[1]) b.stageChecks[1] = {};
  b.stageChecks[1][0] = true;                          // 입금 확인 체크
  if((b.currentStage||0) < 1) b.currentStage = 1;     // 예약 확정 단계로 진입
  saveBookings();
  addCustLog(custName, `예약금 입금 확인 — ${fmtPrice(Number(b.payments?.deposit?.amt||0))}`);
  refreshHistAmt(bid, custName);
}
// 잔금 완납 처리 (원클릭)
function histConfirmBalance(bid, custName) {
  const b = bookings.find(x=>x.id===bid);
  if(!b) return;
  initPayments(b);
  const total  = priceTotal(b);
  const remain = Math.max(0, total - paidTotal(b));
  if(remain <= 0) return;
  const nextId = ((b.payments.midterms||[]).reduce((mx,m)=>Math.max(mx,m.id),0))+1;
  if(!b.payments.midterms) b.payments.midterms = [];
  b.payments.midterms.push({id: nextId, amt: remain, method:'계좌이체'});
  saveBookings();
  addCustLog(custName, `잔금 완납 — ${fmtPrice(remain)}`);
  refreshHistAmt(bid, custName);
  updatePriceUI(bid);
}

// ====================== 통합 검색 ======================
function openGSearch() {
  document.getElementById('gsearch-modal').classList.add('open');
  setTimeout(()=>{ const el=document.getElementById('gsearch-input'); if(el){el.focus();el.value='';renderGSearch();} },100);
}
function closeGSearch() {
  document.getElementById('gsearch-modal').classList.remove('open');
}
function renderGSearch() {
  const q = (document.getElementById('gsearch-input')?.value||'').trim().toLowerCase();
  const el = document.getElementById('gsearch-result');
  if(!el) return;
  if(!q) { el.innerHTML='<div style="text-align:center;color:#bbb;padding:20px">이름, 전화번호, 날짜(2025-04), 상품명, 메모 등 입력하세요</div>'; return; }
  const results = bookings.filter(b=>{
    const p = PRODUCTS[b.product]||PRODUCTS.story;
    // 기본 예약 필드
    const basicMatch = [b.name,b.phone,b.email,b.date,b.familyNames,b.memo,b.childName,p.name,b.postponedDate]
      .filter(Boolean).some(v=>v.toLowerCase().includes(q));
    if(basicMatch) return true;
    // 전화번호 뒷자리 숫자 검색
    const phoneDigits = (b.phone||'').replace(/[^0-9]/g,'');
    const queryDigits = q.replace(/[^0-9]/g,'');
    if(queryDigits.length >= 3 && phoneDigits.endsWith(queryDigits)) return true;
    // 고객번호
    if(custNumbers[b.name] && String(custNumbers[b.name]).padStart(4,'0').includes(q)) return true;
    // 가족 정보 (새 custProfiles)
    const prof = custProfiles[b.name]||{};
    if((prof.familyInfo||'').toLowerCase().includes(q)) return true;
    // 고객 메모 (전체)
    if((custMemos[b.name]||'').toLowerCase().includes(q)) return true;
    // 활동 로그
    if((custLogs[b.name]||[]).some(l=>(l.text||'').toLowerCase().includes(q))) return true;
    return false;
  }).sort((a,bb)=>bb.date.localeCompare(a.date)||bb.time.localeCompare(a.time));
  if(!results.length) { el.innerHTML='<div style="text-align:center;color:#bbb;padding:20px">검색 결과 없음</div>'; return; }
  el.innerHTML = results.map(b=>{
    const p = PRODUCTS[b.product]||PRODUCTS.story;
    const {label:stl,color:stc} = getDynamicStatusLabel(b);
    const t = (parseInt(b.adults)||0)+(parseInt(b.kids)||0);
    const amt = b.priceItems ? priceTotal(b) : 0;
    const postponeTag = b.postponed?`<span style="font-size:10px;background:#fff7ed;color:#c2410c;border:1px solid #fed7aa;border-radius:5px;padding:1px 5px">📅 연기${b.postponedDate?' → '+fmtDateKo(b.postponedDate):''}</span>`:'';
    return `<div style="border:1px solid #e8e8e8;border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;background:#fff"
      onclick="closeGSearch();selectCustFromPopup('${b.name.replace(/'/g,"\\'")}')">
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:2px">
        <span style="font-size:13px;font-weight:700;color:#1a1a2e">${escHtml(b.name)}</span>
        <span style="font-size:11px;background:${p.color};color:#fff;border-radius:6px;padding:1px 7px">${p.name}</span>
        ${t>0?`<span style="font-size:11px;background:#dbeafe;color:#1d4ed8;border-radius:6px;padding:1px 5px">👥${t}명</span>`:''}
        <span style="font-size:11px;font-weight:700;color:${stc}">${stl}</span>
        ${postponeTag}
      </div>
      <div style="font-size:12px;color:#666">${fmtDateKo(b.date)} ${fmtTime(b.time)}
        ${b.phone?`<span style="margin-left:8px">📞 ${b.phone}</span>`:''}
        ${amt>0?`<span style="margin-left:8px;color:#059669">💰 ${fmtPrice(amt)}</span>`:''}
      </div>
      ${b.memo?`<div style="font-size:11px;color:#92400e;background:#fef3c7;border-radius:4px;padding:2px 7px;margin-top:3px">📝 ${escHtml(b.memo.trim().substring(0,60))}</div>`:''}
      ${(custProfiles[b.name]||{}).familyInfo?`<div style="font-size:11px;color:#6b21a8;background:#fdf4ff;border-radius:4px;padding:2px 7px;margin-top:3px">👨‍👩‍👧 ${escHtml((custProfiles[b.name].familyInfo||'').substring(0,60).replace(/\n/g,' · '))}</div>`:''}
      ${(custMemos[b.name]||'')?`<div style="font-size:11px;color:#92400e;background:#fffde7;border-radius:4px;padding:2px 7px;margin-top:3px">💬 ${escHtml((custMemos[b.name]||'').trim().substring(0,60))}</div>`:''}
    </div>`;
  }).join('') + `<div style="font-size:11px;color:#bbb;text-align:center;margin-top:8px">총 ${results.length}건 검색됨 — 클릭하면 고객카드로 이동</div>`;
}

// ====================== 매출 통계 ======================
function showStats() {
  document.getElementById('stats-modal').classList.add('open');
  renderStats();
}
function closeStats() {
  document.getElementById('stats-modal').classList.remove('open');
}
function renderStats() {
  // ── 분포도: 전체 예약 (가격 무관) ──
  const allBks = bookings.filter(b=>b.date);
  const distMonths = [...new Set(allBks.map(b=>b.date.slice(0,7)))].sort();
  const distProds  = [...new Set(allBks.map(b=>b.product||'story'))];
  let distHtml = '';
  if(distMonths.length > 0) {
    // 상품별 색상 맵
    const pColors = distProds.map(pk=>(PRODUCTS[pk]||PRODUCTS.story).color);
    const pNames  = distProds.map(pk=>(PRODUCTS[pk]||PRODUCTS.story).name);
    // 월별·상품별 카운트
    const grid = {};
    allBks.forEach(b=>{
      const ym = b.date.slice(0,7), pk = b.product||'story';
      if(!grid[ym]) grid[ym]={};
      grid[ym][pk] = (grid[ym][pk]||0)+1;
    });
    const maxPerMonth = Math.max(...distMonths.map(ym=>distProds.reduce((s,pk)=>s+(grid[ym]?.[pk]||0),0)),1);
    const BAR_H = 80, PAD_L = 36, PAD_B = 28, PAD_T = 10;
    const bw = Math.max(24, Math.min(50, Math.floor(480/distMonths.length)-6));
    const gap = Math.max(4,Math.min(10,Math.floor(480/distMonths.length)-bw));
    const chartW = PAD_L + distMonths.length*(bw+gap)+8;
    // y 눈금
    const yTicks = [0,Math.ceil(maxPerMonth/2),maxPerMonth].map(v=>{
      const cy = PAD_T + BAR_H*(1-v/maxPerMonth);
      return `<line x1="${PAD_L}" y1="${cy}" x2="${chartW}" y2="${cy}" stroke="#f0f0f0" stroke-width="1"/>
              <text x="${PAD_L-4}" y="${cy+3}" text-anchor="end" font-size="9" fill="#bbb">${v}</text>`;
    }).join('');
    // 스택 막대
    const bars = distMonths.map((ym,i)=>{
      const [,m]=ym.split('-');
      const x = PAD_L + i*(bw+gap);
      let curH=0, rects='';
      distProds.forEach((pk,pi)=>{
        const cnt = grid[ym]?.[pk]||0;
        if(!cnt) return;
        const h = BAR_H*cnt/maxPerMonth;
        const y = PAD_T + BAR_H - curH - h;
        rects += `<rect x="${x}" y="${y}" width="${bw}" height="${h}" fill="${pColors[pi]}" opacity="0.85">
          <title>${pNames[pi]}: ${cnt}건</title></rect>`;
        if(cnt>=1&&h>=10) rects+=`<text x="${x+bw/2}" y="${y+h/2+4}" text-anchor="middle" font-size="8" fill="#fff" font-weight="700">${cnt}</text>`;
        curH+=h;
      });
      const total = distProds.reduce((s,pk)=>s+(grid[ym]?.[pk]||0),0);
      const totalTxt = total>0?`<text x="${x+bw/2}" y="${PAD_T+BAR_H-curH-3}" text-anchor="middle" font-size="9" font-weight="700" fill="#555">${total}</text>`:'';
      const xLbl = `<text x="${x+bw/2}" y="${PAD_T+BAR_H+14}" text-anchor="middle" font-size="9" fill="#666">${parseInt(m)}월</text>`;
      return rects+totalTxt+xLbl;
    }).join('');
    // 범례
    const legend = distProds.map((pk,pi)=>`
      <span style="display:flex;align-items:center;gap:3px;font-size:10px;color:#555">
        <span style="width:10px;height:10px;background:${pColors[pi]};border-radius:2px;display:inline-block"></span>${pNames[pi]}
      </span>`).join('');
    distHtml = `
    <div style="margin-bottom:20px">
      <div style="font-size:13px;font-weight:700;color:#333;margin-bottom:10px">📊 상품별 예약 분포 (전체)</div>

        <svg width="${Math.max(chartW,280)}" height="${PAD_T+BAR_H+PAD_B}" style="display:block">
          ${yTicks}
          <line x1="${PAD_L}" y1="${PAD_T}" x2="${PAD_L}" y2="${PAD_T+BAR_H}" stroke="#ddd" stroke-width="1"/>

  // 가격 정보가 있는 예약만
  const bks = bookings.filter(b => b.priceItems && b.priceItems.length > 0 && b.payments);

  let sumTotal=0, sumPaid=0, sumPending=0, cntFull=0, cntPending=0;
  const byMonth = {}, byProduct = {};

  bks.forEach(b => {
    const total = priceTotal(b);
    const paid  = paidTotal(b);
    const remain = Math.max(0, total - paid);
    sumTotal   += total;
    sumPaid    += paid;
    sumPending += remain;
    if(remain <= 0) cntFull++; else cntPending++;

    // 월별
    const ym = b.date ? b.date.slice(0,7) : '미정';
    if(!byMonth[ym]) byMonth[ym]={cnt:0,total:0,paid:0,pending:0};
    byMonth[ym].cnt++;byMonth[ym].total+=total;byMonth[ym].paid+=paid;byMonth[ym].pending+=remain;

    // 상품별
    const pk = b.product||'story';
    if(!byProduct[pk]) byProduct[pk]={cnt:0,total:0,paid:0,pending:0};
    byProduct[pk].cnt++;byProduct[pk].total+=total;byProduct[pk].paid+=paid;byProduct[pk].pending+=remain;
  });

  const card = (icon,label,val,sub,color)=>`
    <div style="flex:1;min-width:130px;background:#fff;border-radius:10px;padding:14px 16px;border:1.5px solid #e8e8e8">
      <div style="font-size:11px;color:#888;margin-bottom:4px">${icon} ${label}</div>
      <div style="font-size:18px;font-weight:800;color:${color||'#1a1a2e'}">${fmtPrice(val)}</div>
      ${sub?`<div style="font-size:11px;color:#aaa;margin-top:3px">${sub}</div>`:''}
    </div>`;

  const thStyle = 'padding:8px 10px;font-size:11px;color:#888;font-weight:600;text-align:right;border-bottom:2px solid #f0f0f0';
  const thStyleL = 'padding:8px 10px;font-size:11px;color:#888;font-weight:600;text-align:left;border-bottom:2px solid #f0f0f0';
  const td = (v,bold,color)=>`<td style="padding:7px 10px;font-size:13px;text-align:right;${bold?'font-weight:700;':''}color:${color||'#333'}">${v}</td>`;
  const tdL = (v,color)=>`<td style="padding:7px 10px;font-size:13px;color:${color||'#333'}">${v}</td>`;

  // 월별 테이블
  const months = Object.keys(byMonth).sort().reverse();
  const monthRows = months.map(ym=>{
    const r=byMonth[ym];
    const parts = ym.split('-');
    const ymLabel = parts.length===2 ? `${parts[0]}년 ${parseInt(parts[1])}월` : '날짜 미정';
    return `<tr style="border-bottom:1px solid #f5f5f5">
      ${tdL(ymLabel)}

  // 상품별 테이블

    const pname = PRODUCTS[pk]?.name||pk;
