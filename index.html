      ${tdL(`<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${pcolor};margin-right:5px"></span>${pname}`)}
      ${td(r.cnt+'건')}
      ${td(fmtPrice(r.total),true)}
      ${td(fmtPrice(r.paid),false,'#059669')}
      ${td(r.pending>0?fmtPrice(r.pending):'-',r.pending>0,r.pending>0?'#dc2626':'#aaa')}
    </tr>`;
  }).join('');

  // ── 월별 매출 그래프 (SVG 막대) ──
  const chartMonths = Object.keys(byMonth).sort(); // 오래된 순
  let graphHtml = '';
  if(chartMonths.length > 0) {
    const maxVal = Math.max(...chartMonths.map(ym=>byMonth[ym].total), 1);
    const BAR_W = Math.max(28, Math.min(60, Math.floor(520 / chartMonths.length) - 10));
    const GAP   = Math.max(6, Math.min(14, Math.floor(520 / chartMonths.length) - BAR_W));
    const H = 160, PAD_L = 62, PAD_B = 36, PAD_T = 16;
    const chartW = PAD_L + chartMonths.length*(BAR_W+GAP) + 10;

    // Y축 눈금 (4단계)
    const ticks = [0,0.25,0.5,0.75,1].map(r=>Math.round(maxVal*r));
    const yTickSvg = ticks.map(v=>{
      const cy = PAD_T + H*(1 - v/maxVal);
      const label = v>=100000000 ? (v/100000000).toFixed(1)+'억'
                  : v>=10000    ? Math.round(v/10000)+'만'
                  : v===0       ? '0' : v.toLocaleString();
      return `<line x1="${PAD_L}" y1="${cy}" x2="${chartW}" y2="${cy}" stroke="#f0f0f0" stroke-width="1"/>
              <text x="${PAD_L-6}" y="${cy+4}" text-anchor="end" font-size="9" fill="#bbb">${label}</text>`;
    }).join('');

    // 막대 + 라벨
    const barsSvg = chartMonths.map((ym,i)=>{
      const r = byMonth[ym];
      const [,m] = ym.split('-');
      const x = PAD_L + i*(BAR_W+GAP);

      const totalH  = Math.max(2, H * r.total  / maxVal);
      const paidH   = Math.max(0, H * r.paid   / maxVal);
      const pendingH= Math.max(0, H * Math.min(r.pending, r.total) / maxVal);

      const yTotal  = PAD_T + H - totalH;
      const yBottom = PAD_T + H;

      // 총액 막대 (연보라 배경)
      const barTotal  = `<rect x="${x}" y="${yTotal}" width="${BAR_W}" height="${totalH}" rx="3" fill="#e0e7ff"/>`;
      // 수금 막대 (초록, 아래부터)
      const yPaid = PAD_T + H - paidH;
      const barPaid = paidH>0 ? `<rect x="${x}" y="${yPaid}" width="${BAR_W}" height="${paidH}" rx="3" fill="#34d399" opacity="0.9"/>` : '';

      // 총액 텍스트 (막대 위)
      const amtLabel = r.total>=10000000 ? (r.total/10000000).toFixed(1)+'천만'
                     : r.total>=100000   ? Math.round(r.total/10000)+'만'
                     : r.total>0         ? r.total.toLocaleString() : '';
      const amtText = amtLabel ? `<text x="${x+BAR_W/2}" y="${yTotal-4}" text-anchor="middle" font-size="9" font-weight="700" fill="#6366f1">${amtLabel}</text>` : '';

      // X축 월 라벨
      const xLabel = `<text x="${x+BAR_W/2}" y="${yBottom+14}" text-anchor="middle" font-size="10" fill="#666">${parseInt(m)}월</text>`;

      // 건수
      const cntText = `<text x="${x+BAR_W/2}" y="${yBottom+25}" text-anchor="middle" font-size="9" fill="#aaa">${r.cnt}건</text>`;

      return barTotal + barPaid + amtText + xLabel + cntText;
    }).join('');

    const svgH = PAD_T + H + PAD_B;
    graphHtml = `
    <div style="margin-bottom:20px">
      <div style="font-size:13px;font-weight:700;color:#333;margin-bottom:10px">📊 월별 매출 변동</div>
      <div style="background:#fafafa;border:1px solid #e8e8e8;border-radius:10px;padding:12px 8px 4px;overflow-x:auto;-webkit-overflow-scrolling:touch">
        <svg width="${Math.max(chartW,300)}" height="${svgH}" style="display:block;min-width:100%">
          ${yTickSvg}
          <line x1="${PAD_L}" y1="${PAD_T}" x2="${PAD_L}" y2="${PAD_T+H}" stroke="#ddd" stroke-width="1"/>
          <line x1="${PAD_L}" y1="${PAD_T+H}" x2="${chartW}" y2="${PAD_T+H}" stroke="#ddd" stroke-width="1"/>
          ${barsSvg}
        </svg>
        <div style="display:flex;gap:12px;justify-content:center;padding:6px 0 4px;flex-wrap:wrap">
          <span style="font-size:10px;color:#6366f1;display:flex;align-items:center;gap:4px"><span style="display:inline-block;width:10px;height:10px;background:#e0e7ff;border-radius:2px"></span>총 매출</span>
          <span style="font-size:10px;color:#059669;display:flex;align-items:center;gap:4px"><span style="display:inline-block;width:10px;height:10px;background:#34d399;border-radius:2px"></span>수금</span>
        </div>
      </div>
    </div>`;
  }

  document.getElementById('stats-body').innerHTML = `
    <!-- 요약 카드 -->
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px">
      ${card('💰','총 매출액',sumTotal,`전체 ${bks.length}건`)}
      ${card('✅','수금 완료',sumPaid,`완납 ${cntFull}건`,'#059669')}
      ${card('⚠️','미수금',sumPending,`잔금 남은 ${cntPending}건`,sumPending>0?'#dc2626':'#aaa')}
    </div>

    <!-- 상품 분포도 -->
    ${distHtml}

    <!-- 월별 매출 그래프 -->
    ${graphHtml}

    <!-- 월별 -->
    <div style="margin-bottom:20px">
      <div style="font-size:13px;font-weight:700;color:#333;margin-bottom:8px">📅 월별 매출</div>
      <div style="border:1px solid #e8e8e8;border-radius:10px;overflow:hidden">
        <table style="width:100%;border-collapse:collapse">
          <thead style="background:#f8f9fa">
            <tr>
              <th style="${thStyleL}">월</th>
              <th style="${thStyle}">건수</th>
              <th style="${thStyle}">총액</th>
              <th style="${thStyle}">수금</th>
              <th style="${thStyle}">미수금</th>
            </tr>
          </thead>
          <tbody>${monthRows||'<tr><td colspan="5" style="padding:20px;text-align:center;color:#bbb">데이터 없음</td></tr>'}</tbody>
        </table>
      </div>
    </div>

    <!-- 상품별 -->
    <div>
      <div style="font-size:13px;font-weight:700;color:#333;margin-bottom:8px">🎞 상품별 매출</div>
      <div style="border:1px solid #e8e8e8;border-radius:10px;overflow:hidden">
        <table style="width:100%;border-collapse:collapse">
          <thead style="background:#f8f9fa">
            <tr>
              <th style="${thStyleL}">상품</th>
              <th style="${thStyle}">건수</th>
              <th style="${thStyle}">총액</th>
              <th style="${thStyle}">수금</th>
              <th style="${thStyle}">미수금</th>
            </tr>
          </thead>
          <tbody>${prodRows||'<tr><td colspan="5" style="padding:20px;text-align:center;color:#bbb">데이터 없음</td></tr>'}</tbody>
        </table>
      </div>
    </div>
    <div style="margin-top:12px;font-size:11px;color:#bbb;text-align:center">가격 계산이 입력된 예약만 집계됩니다</div>
  `;
}
function exportData() {
  const data = {
    bookings: bookings,
    customers: customers,
    dateMemos: dateMemos,
    exportedAt: new Date().toISOString()
  };
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const today = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `감탄사진관_백업_${today}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

// ====================== SM메이트 가져오기 ======================
function smProductKey(smName) {
  const n = (smName||'').trim();
  if (!n) return 'story';
  if (n.includes('증명') || n.includes('선거사진')) return 'id';
  if (n.includes('가족성장') || n.includes('성장패키지')) return 'growth';
  if (n.includes('심플패밀리')) return 'simpfam';
  if (n.includes('스토리')) return 'story';
  if (n.includes('베이비') || n.includes('키즈') || n.includes('돌 가족') || n.includes('100일')) return 'kids';
  if (n.includes('장수')) return 'jangsu';
  if (n.includes('대가족') || n.includes('5인이상') || n.includes('8인') || n.includes('성인(대)')) return 'bigfam';
  if (n.includes('가족')) return 'story';
  if (n.includes('프로필') || n.includes('화보') || n.includes('학사모') || n.includes('연주') || n.includes('우정') || n.includes('단체') || n.includes('커플') || n.includes('기념일')) return 'profile';
  if (n.includes('웨딩') || n.includes('만삭') || n.includes('스냅')) return 'profile';
  return 'story';
}

function parseSmXls(raw) {
  const txt = new TextDecoder('euc-kr').decode(raw);
  return txt.split(/\r?\n/).map(line => line.split('\t').map(c => c.trim()));
}

function importSmMate(e) {
  const files = Array.from(e.target.files);
  if (!files.length) return;

  let custRows = null;   // themel20466 계열 - 고객 마스터
  let schedRows = null;  // themel60884 계열 - 스케줄

  let loaded = 0;
  const readers = [];

  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = function(ev) {
      const raw = new Uint8Array(ev.target.result);
      const rows = parseSmXls(raw);
      const header = rows[0] || [];

      if (header.includes('총액') && header.includes('계약일')) {
        custRows = rows;
      } else if (header.includes('스케줄구분') && header.includes('일자')) {
        schedRows = rows;
      }

      loaded++;
      if (loaded === files.length) {
        doSmImport(custRows, schedRows);
      }
    };
    reader.readAsArrayBuffer(file);
  });

  e.target.value = '';
}

function doSmImport(custRows, schedRows) {
  if (!custRows) {
    alert('고객 마스터 파일(총액/계약일 포함)을 찾을 수 없습니다.\n파일을 다시 확인해주세요.');
    return;
  }

  const header = custRows[0];
  const col = k => header.indexOf(k);

  const C = {
    no:       col('No'),
    name:     col('아기') !== -1 ? col('아기') : col('고객명'),
    product:  col('상품'),
    contract: col('계약일'),
    total:    col('총액'),
    deposit:  col('선금'),
    mid:      col('중도금'),
    phone:    col('엄마폰') !== -1 ? col('엄마폰') : col('휴대폰'),
    phone2:   col('아빠폰'),
    memo:     col('메모'),
  };

  // 스케줄 인덱스 (전화번호 기준으로 빠른 검색)
  const schedByPhone = {};
  const schedByName  = {};
  if (schedRows) {
    const sh = schedRows[0];
    const si = {
      type:  sh.indexOf('스케줄구분'),
      date:  sh.indexOf('일자'),
      time:  sh.indexOf('시각'),
      title: sh.indexOf('제목'),
      name:  sh.indexOf('고객명'),
      phone: sh.indexOf('휴대폰'),
      memo:  sh.indexOf('메모'),
    };
    schedRows.slice(1).forEach(r => {
      if (!r[si.type] || r[si.type] !== '촬영') return;
      const ph  = (r[si.phone]||'').trim();
      const nm  = (r[si.name]||'').trim().replace(/\(.*?\)/g,'').trim();
      const entry = { date: r[si.date], time: r[si.time], title: r[si.title], memo: r[si.memo] };
      if (ph) { if (!schedByPhone[ph]) schedByPhone[ph]=[]; schedByPhone[ph].push(entry); }
      if (nm) { if (!schedByName[nm])  schedByName[nm] =[];  schedByName[nm].push(entry);  }
    });
  }

  let addedCust = 0, addedBooking = 0, skipped = 0;
  const existingPhones = new Set(customers.map(c => c.phone));

  custRows.slice(1).forEach(r => {
    if (!r[C.name]) return;
    const rawName   = r[C.name];
    const cleanName = rawName.split('(')[0].trim();
    if (!cleanName) return;

    const phone     = (r[C.phone]||r[C.phone2]||'').trim();
    const smProduct = r[C.product]||'';
    const contractDate = (r[C.contract]||'').trim().replace(/\//g,'-').slice(0,10);
    const totalAmt  = parseInt(r[C.total])||0;
    const depositAmt= parseInt(r[C.deposit])||0;
    const memoTxt   = r[C.memo]||'';
    const prodKey   = smProductKey(smProduct);

    // 1) 고객 등록 (없으면 추가)
    let cust = customers.find(c => c.phone && c.phone === phone && phone)
            || customers.find(c => c.name === cleanName);
    if (!cust) {
      cust = { name: cleanName, phone, memo: memoTxt };
      customers.push(cust);
      addedCust++;
    }

    // 2) 계약일 히스토리 (가격 포함)
    if (contractDate) {
      const contractId = 'sm_c_' + (r[C.no]||Date.now().toString(36));
      const alreadyExists = bookings.find(b => b.id === contractId);
      if (!alreadyExists) {
        const contractBooking = {
          id: contractId,
          name: cleanName,
          phone,
          product: prodKey,
          date: contractDate,
          time: '',
          adults: 2, kids: 0,
          memo: '[SM메이트 계약] ' + smProduct
            + (totalAmt > 0 ? ' / SM총액: ' + totalAmt.toLocaleString('ko-KR') + '원' : '')
            + (memoTxt ? ' / ' + memoTxt : ''),
          stage: 1,
          stageChecks: {},
          priceItems: [],
          payments: { deposit: { amt: 0, method: '계좌이체' }, midterms: [] },
          smImport: true,
        };
        bookings.push(contractBooking);
        addedBooking++;
      } else {
        skipped++;
      }
    }

    // 3) 촬영일 히스토리 (스케줄에서 매칭)
    const matched = (phone && schedByPhone[phone]) || schedByName[cleanName] || [];
    matched.forEach((s, idx) => {
      const shootDate = (s.date||'').trim().replace(/\//g,'-').slice(0,10);
      if (!shootDate || shootDate === contractDate) return; // 계약일과 같으면 skip
      const shootId = 'sm_s_' + (r[C.no]||'x') + '_' + idx;
      if (bookings.find(b => b.id === shootId)) { skipped++; return; }
      const shootBooking = {
        id: shootId,
        name: cleanName,
        phone,
        product: smProductKey(s.title || smProduct),
        date: shootDate,
        time: s.time||'',
        adults: 2, kids: 0,
        memo: '[SM메이트 촬영] ' + (s.title||smProduct) + (s.memo ? ' / ' + s.memo : ''),
        stage: 7,  // 완료
        stageChecks: {},
        priceItems: [],
        payments: { deposit: { amt: 0, method: '계좌이체' }, midterms: [] },
        smImport: true,
      };
      bookings.push(shootBooking);
      addedBooking++;
    });
  });

  saveBookings();
  saveCustomers();
  renderAll();
  alert(`SM메이트 가져오기 완료!\n고객 ${addedCust}명 추가\n히스토리 ${addedBooking}건 추가\n중복 건너뜀 ${skipped}건`);
}

function importData(e) {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const data = JSON.parse(ev.target.result);
      if(data.bookings) { bookings = data.bookings; saveBookings(); }
      if(data.customers) { customers = data.customers; saveCustomers(); }
      if(data.dateMemos) { dateMemos = data.dateMemos; saveDateMemos(); }
      renderAll();
      alert('가져오기 완료! 예약 데이터가 불러와졌습니다.');
    } catch(err) {
      alert('파일을 읽는 중 오류가 발생했습니다. 올바른 백업 파일인지 확인해주세요.');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}
</script>
