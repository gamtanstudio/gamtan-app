<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>감탄사진관 통합 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
/* ===== 터치 탭 픽스 (안드로이드 클릭 딜레이 제거) ===== */
html{-webkit-tap-highlight-color:transparent}
button,[onclick]{touch-action:manipulation;cursor:pointer}
.booking-card,.sub-card,.cl-item,.stage-header,.cust-group-header,.view-tab,.mc-entry,.mc-cell{touch-action:manipulation}
body{font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:#f0f2f5;height:100vh;display:flex;flex-direction:column;overflow:hidden;font-size:15px}
#header{background:#1a1a2e;color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#header h1{font-size:18px;font-weight:700;letter-spacing:1px}
#header span{font-size:13px;opacity:.6}
#main{display:flex;flex:1;overflow:hidden}
/* LEFT */
#right{flex:1;overflow-y:auto;padding:16px 20px;background:#f0f2f5;font-size:15px}
#btn-add{background:#1a1a2e;color:#fff;border:none;border-radius:6px;padding:7px 14px;font-size:14px;cursor:pointer;white-space:nowrap}
#btn-add:hover{background:#2d2d4e}
.view-tabs{display:flex;gap:4px;width:100%;margin-top:2px}
.view-tab{flex:1;border:1px solid #e0e0e0;background:#f5f5f5;border-radius:6px;padding:5px;font-size:13px;cursor:pointer;color:#888;font-weight:600;transition:all .2s;text-align:center}
.view-tab.active{background:#1a1a2e;color:#fff;border-color:#1a1a2e}
#booking-list{flex:1;overflow-y:auto;padding:8px}
#booking-list.cal-mode{padding:0;overflow:hidden;display:flex;flex-direction:column}
.date-group{margin-bottom:8px}
.date-label{font-size:14px;font-weight:700;color:#888;padding:6px 8px 4px;display:flex;align-items:center;gap:4px}
/* 고객별 보기 */
.cust-group{margin-bottom:10px;border-radius:12px;overflow:hidden;border:1px solid #e0e0e0;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.cust-group-header{display:flex;align-items:center;padding:10px 12px;cursor:pointer;gap:6px;user-select:none;min-width:0;border-left:5px solid transparent;transition:opacity .15s}
.cust-group-header:hover{opacity:.88}
.cust-group-header.active-cust{filter:brightness(.96)}
/* 교대 색상 — 4가지 색 반복 */
.cust-group:nth-child(4n+1) .cust-group-header{background:#f0f0ff;border-left-color:#6366f1}
.cust-group:nth-child(4n+2) .cust-group-header{background:#f0fdf4;border-left-color:#16a34a}
.cust-group:nth-child(4n+3) .cust-group-header{background:#fff7ed;border-left-color:#ea580c}
.cust-group:nth-child(4n+0) .cust-group-header{background:#f0f9ff;border-left-color:#0891b2}
/* 활성 고객 강조 */
.cust-group:nth-child(4n+1) .cust-group-header.active-cust{background:#e0e0ff}
.cust-group:nth-child(4n+2) .cust-group-header.active-cust{background:#dcfce7}
.cust-group:nth-child(4n+3) .cust-group-header.active-cust{background:#ffedd5}
.cust-group:nth-child(4n+0) .cust-group-header.active-cust{background:#e0f2fe}
.cg-name{font-size:15px;font-weight:700;color:#222;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cg-count{font-size:12px;background:#6366f1;color:#fff;border-radius:12px;padding:2px 9px;font-weight:700;white-space:nowrap;flex-shrink:0}
.cg-chev{color:#bbb;font-size:13px;transition:transform .2s;flex-shrink:0}
.cg-add-btn{font-size:12px;background:#6366f1;color:#fff;border:none;border-radius:7px;padding:4px 11px;cursor:pointer;font-weight:700;white-space:nowrap;flex-shrink:0}
.cg-add-btn:hover{background:#4f46e5}
.cust-group-body{display:none;background:#fff}
.cust-group-body.open{display:block}
/* CALENDAR */
.calendar-wrap{padding:12px 14px 8px;background:#fff;border-bottom:2px solid #e8e8e8;flex-shrink:0}
.cal-header{display:flex;align-items:center;justify-content:space-between;padding:0 2px 10px}
.cal-title{font-size:17px;font-weight:700;color:#1a1a2e}
.cal-nav{background:none;border:1px solid #e0e0e0;border-radius:8px;padding:4px 14px;cursor:pointer;font-size:18px;color:#555;line-height:1.4}
.cal-nav:hover{background:#f0f0f0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow{text-align:center;font-size:13px;font-weight:700;color:#aaa;padding:4px 0 6px}
.cal-dow.sun{color:#ef4444}.cal-dow.sat{color:#6366f1}
.cal-cell{min-height:52px;border-radius:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;padding:4px 2px 3px;gap:3px;transition:background .12s;position:relative}
.cal-cell:not(.empty):hover{background:#f0f4ff}
.cal-cell.empty{cursor:default;opacity:0}
.cal-day-num{font-size:14px;color:#333;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-weight:500}
.cal-cell.today .cal-day-num{background:#1a1a2e;color:#fff;font-weight:700}
.cal-cell.selected{background:#eef2ff}
.cal-cell.selected .cal-day-num{color:#4f46e5;font-weight:700}
.cal-cell.today.selected .cal-day-num{background:#4f46e5;color:#fff}
.cal-cell.sun .cal-day-num{color:#ef4444}
.cal-cell.sat .cal-day-num{color:#6366f1}
.cal-dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;padding:0 2px}
.cal-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.cal-sel-label{padding:8px 16px 6px;font-size:13px;font-weight:700;color:#888;background:#f8f9fa;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between}
.cal-sel-count{font-size:13px;background:#6366f1;color:#fff;border-radius:10px;padding:2px 10px}
.cal-empty-day{text-align:center;color:#ccc;font-size:14px;padding:24px 0}
.cust-info-bar{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.cinfo-item{font-size:12px;border-radius:8px;padding:3px 8px;white-space:nowrap}
.cinfo-item.phone{background:#e0f2fe;color:#0369a1}
.cinfo-item.email{background:#f0fdf4;color:#166534}
.cinfo-item.family{background:#faf5ff;color:#6b21a8}
.cust-summary{padding:8px 14px 4px;display:flex;gap:6px;flex-wrap:wrap;background:#fafafa}
.cust-summary-chip{font-size:12px;color:#666;background:#f0f0f0;border-radius:10px;padding:3px 9px}
.cust-summary-chip.family{background:#ede9fe;color:#5b21b6}
.cust-summary-chip.phone{background:#e0f2fe;color:#0369a1}
.cust-memo-block{padding:6px 14px 8px;background:#fffbeb;border-top:1px solid #fde68a}
.cust-memo-entry{font-size:12px;color:#92400e;padding:2px 0 2px 4px;border-left:2px solid #f59e0b;margin-bottom:3px;line-height:1.5}
.cust-memo-entry .memo-date{font-size:11px;color:#b45309;font-weight:700;margin-right:6px}
.sub-memo{font-size:11px;color:#92400e;background:#fef3c7;border-radius:4px;padding:2px 7px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.sub-card{display:flex;align-items:center;padding:8px 14px;cursor:pointer;border-top:1px solid #f0f0f0;gap:8px}
.sub-card:hover{background:#f5f7ff}
.sub-card.active{background:#eef2ff}
.sub-date{font-size:12px;color:#888;min-width:70px}
.sub-prod{font-size:12px;padding:2px 8px;border-radius:10px;color:#fff;white-space:nowrap}
.sub-time{font-size:13px;color:#555;margin-left:auto}
.sub-dots{display:flex;gap:2px;margin-left:6px}
.sub-dot{width:8px;height:4px;border-radius:2px;background:#e0e0e0}
.sub-dot.done{background:#6366f1}
.sub-dot.cur{background:#a5b4fc}
.sub-dot.post-wait{background:transparent;border:1px solid #d0d0d0}
.sub-dot.post-done{background:#10b981}
.sub-dot.post-cur{background:#34d399}
.booking-card{background:#f8f9fa;border:2px solid transparent;border-radius:10px;padding:10px 12px;margin-bottom:6px;cursor:pointer;transition:all .2s}
.booking-card:hover{background:#eef2ff;border-color:#a5b4fc}
.booking-card.active{background:#eef2ff;border-color:#6366f1}
.booking-card.completed{background:#f0fdf4;border-color:#86efac;opacity:.8}
.booking-card.completed .bc-name{color:#555}
.booking-card.completed:hover{opacity:1;border-color:#4ade80}
.bc-top{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.bc-name{font-size:15px;font-weight:700;color:#222}
.bc-prod{font-size:11px;padding:2px 7px;border-radius:12px;color:#fff;white-space:nowrap}
.bc-time{font-size:12px;margin-left:auto}
.bc-progress{display:flex;gap:2px;margin-top:6px;align-items:center}
.bc-dot{width:16px;height:6px;border-radius:3px;background:#e0e0e0}
/* 예약 단계 (촬영 전) */
.bc-dot.pre-done{background:#6366f1}
.bc-dot.pre-cur{background:#a5b4fc}
/* 촬영 후 단계 — 아직 촬영 안 한 경우: 테두리만 */
.bc-dot.post-wait{background:transparent;border:1.5px solid #d0d0d0}
/* 촬영 후 단계 — 촬영 완료 후 진행 중 */
.bc-dot.post-done{background:#10b981}
.bc-dot.final-done{background:#f59e0b}
.sub-dot.final-done{background:#f59e0b}
.bc-dot.post-cur{background:#34d399}
.bc-sep{font-size:10px;margin:0 3px;opacity:.45;line-height:1}
.bc-review{margin-left:auto;background:none;border:none;cursor:pointer;font-size:15px;padding:2px 4px;border-radius:6px;line-height:1;opacity:.35;transition:opacity .15s}
.bc-review:hover{opacity:1}
.bc-review.reviewed{opacity:1}
/* RIGHT */
#right{flex:1;overflow-y:auto;padding:16px 20px;background:#f0f2f5;font-size:15px}
#workflow{max-width:860px;margin:0 auto}
#empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#aaa;font-size:16px}
#empty-state svg{width:64px;height:64px;margin-bottom:16px;opacity:.3}
/* WORKFLOW */
#workflow{display:none}
#cust-card{background:#fff;border-radius:12px;padding:16px 20px;margin-bottom:16px;display:flex;align-items:center;gap:12px}
#cust-info h3{font-size:17px;font-weight:700;color:#222}
#cust-info p{font-size:13px;color:#666;margin-top:3px}
.prod-badge{padding:5px 12px;border-radius:20px;color:#fff;font-size:13px;font-weight:700}
.stage-progress{background:#fff;border-radius:12px;padding:14px 20px;margin-bottom:16px}
.sp-label{font-size:12px;color:#888;margin-bottom:8px}
.sp-bar{display:flex;gap:4px}
.sp-step{flex:1;height:8px;border-radius:4px;background:#e0e0e0;cursor:pointer;transition:background .2s}
.sp-step.done{background:#6366f1}
.sp-step.current{background:#a5b4fc}
.sp-step:hover{opacity:.8}
.sp-nums{display:flex;justify-content:space-between;margin-top:4px}
.sp-num{font-size:10px;color:#bbb;flex:1;text-align:center}
.sp-num.active{color:#6366f1;font-weight:700}
/* STAGES */
.stage-section{background:#fff;border-radius:12px;margin-bottom:12px;overflow:hidden;border:2px solid transparent}
.stage-section.current-stage{border-color:#6366f1}
.stage-header{display:flex;align-items:center;padding:14px 18px;cursor:pointer;user-select:none}
.stage-num{width:28px;height:28px;border-radius:50%;background:#e0e0e0;color:#888;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-right:10px;flex-shrink:0}
.stage-section.done-stage .stage-num{background:#6366f1;color:#fff}
.stage-section.current-stage .stage-num{background:#6366f1;color:#fff}
.stage-title{font-size:14px;font-weight:700;color:#333;flex:1}
.stage-status{font-size:12px;padding:3px 10px;border-radius:12px;font-weight:600}
.ss-done{background:#e8f5e9;color:#388e3c}
.ss-current{background:#ede7f6;color:#6366f1}
.ss-pending{background:#f5f5f5;color:#aaa}
.stage-chevron{margin-left:8px;color:#bbb;transition:transform .2s}
.stage-body{display:none;padding:0 18px 18px;border-top:1px solid #f0f0f0}
.stage-body.open{display:block}
/* CHECKLIST */
.checklist{margin-top:14px;margin-bottom:14px}
.checklist h4{font-size:12px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.cl-item{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;background:#f8f9fa;border-radius:8px;margin-bottom:6px;cursor:pointer}
.cl-item:hover{background:#f0f0f0}
.cl-cb{width:18px;height:18px;border-radius:4px;border:2px solid #ccc;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all .2s}
.cl-item.checked .cl-cb{background:#6366f1;border-color:#6366f1;color:#fff}
.cl-text{flex:1}
.cl-title{font-size:13px;color:#333;font-weight:600}
.cl-detail{font-size:11px;color:#888;margin-top:2px}
/* MESSAGE AREA */
.msg-section{margin-top:4px}
.msg-section h4{font-size:12px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.msg-options{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.msg-opt-btn{border:1px solid #ddd;background:#f8f9fa;border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer;transition:all .2s}
.msg-opt-btn:hover{background:#eef2ff;border-color:#a5b4fc}
.msg-opt-btn.active{background:#eef2ff;border-color:#6366f1;color:#6366f1;font-weight:600}
.frame-selector{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.frame-selector label{font-size:12px;color:#666;margin-right:4px}
.frame-btn{border:1px solid #ddd;background:#f8f9fa;border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer;transition:all .2s}
.frame-btn:hover{background:#eef2ff}
.frame-btn.active{background:#eef2ff;border-color:#6366f1;color:#6366f1;font-weight:600}
.frame-custom{border:1px solid #ddd;border-radius:6px;padding:5px 10px;font-size:12px;width:110px}
.msg-box{position:relative}
.msg-ta{width:100%;border:1px solid #e0e0e0;border-radius:8px;padding:12px;font-size:13px;line-height:1.7;resize:vertical;min-height:160px;font-family:inherit;background:#fafafa;color:#222}
.msg-ta:focus{outline:none;border-color:#6366f1;background:#fff}
.msg-actions{display:flex;gap:8px;margin-top:8px;align-items:center}
.btn-copy{background:#6366f1;color:#fff;border:none;border-radius:8px;padding:9px 20px;font-size:13px;cursor:pointer;font-weight:600;transition:background .2s}
.btn-copy:hover{background:#4f51d8}
.btn-copy.copied{background:#388e3c}
.btn-done{background:#1a1a2e;color:#fff;border:none;border-radius:8px;padding:9px 20px;font-size:13px;cursor:pointer;font-weight:600;transition:background .2s;margin-left:auto}
.btn-done:hover{background:#2d2d4e}
.btn-undone{background:#fff;color:#e53935;border:2px solid #e53935;border-radius:8px;padding:7px 16px;font-size:12px;cursor:pointer;font-weight:600;margin-left:auto}
/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center;padding:10px}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:16px;padding:24px;width:460px;max-width:100%;max-height:90vh;overflow-y:auto}
@media(max-width:768px){
  .modal-bg{align-items:flex-end;padding:0}
  .modal{border-radius:20px 20px 0 0;width:100%;max-width:100%;max-height:92vh;padding:20px 16px 32px}
  .form-row-2{grid-template-columns:1fr 1fr}
  .form-row input,.form-row select{font-size:16px;padding:11px 12px} /* 16px 미만이면 iOS 자동 줌 */
}
.modal h2{font-size:18px;font-weight:700;color:#1a1a2e;margin-bottom:20px}
.form-row{margin-bottom:14px}
.form-row label{display:block;font-size:12px;font-weight:700;color:#666;margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px}
.form-row input,.form-row select{width:100%;border:1px solid #ddd;border-radius:8px;padding:9px 12px;font-size:14px;font-family:inherit}
.form-row input:focus,.form-row select:focus{outline:none;border-color:#6366f1}
.form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toggle-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.toggle-label{font-size:13px;color:#555}
.toggle-switch{position:relative;width:42px;height:24px}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:#ccc;border-radius:12px;cursor:pointer;transition:.3s}
.toggle-slider:before{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.3s}
.toggle-switch input:checked + .toggle-slider{background:#6366f1}
.toggle-switch input:checked + .toggle-slider:before{transform:translateX(18px)}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.btn-cancel{flex:1;background:#f5f5f5;border:none;border-radius:8px;padding:11px;font-size:14px;cursor:pointer;font-weight:600;color:#666}
.btn-save{flex:2;background:#1a1a2e;color:#fff;border:none;border-radius:8px;padding:11px;font-size:14px;cursor:pointer;font-weight:700}
.btn-save:hover{background:#2d2d4e}
.btn-delete{background:#fff;color:#e53935;border:2px solid #e53935;border-radius:8px;padding:9px 16px;font-size:13px;cursor:pointer;font-weight:600}
.no-bookings{text-align:center;color:#ccc;font-size:13px;padding:30px 16px}
#search-wrap{padding:8px 8px 0}
#search-input{width:100%;border:1px solid #e0e0e0;border-radius:8px;padding:8px 12px;font-size:13px;font-family:inherit}
#search-input:focus{outline:none;border-color:#6366f1}
#stage-filter-bar{display:flex;gap:5px;padding:6px 8px 4px;flex-wrap:wrap}
.sf-btn{border:1.5px solid #e0e0e0;background:#f8f9fa;border-radius:20px;padding:4px 10px;font-size:11px;cursor:pointer;color:#666;font-weight:600;white-space:nowrap;transition:all .15s;font-family:inherit}
.sf-btn:hover{border-color:#6366f1;color:#6366f1;background:#eef2ff}
.sf-btn.active{background:#6366f1;color:#fff;border-color:#6366f1}
.sf-btn .sf-cnt{background:rgba(255,255,255,.3);border-radius:10px;padding:0 5px;margin-left:3px;font-size:10px}
.sf-btn:not(.active) .sf-cnt{background:#e0e0e0;color:#555}
.stage-filter-result{padding:6px 12px 4px;font-size:11px;font-weight:700;color:#888;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between}
.stage-filter-clear{font-size:11px;color:#6366f1;cursor:pointer;background:none;border:none;font-family:inherit;font-weight:600;padding:0}
.bc-del{background:none;border:none;color:#ccc;font-size:13px;cursor:pointer;padding:2px 4px;border-radius:4px;line-height:1;margin-left:4px}
.bc-del:hover{background:#fee;color:#e53935}
/* 단골 고객 드롭다운 */
.cust-drop-item{display:flex;align-items:center;padding:9px 14px;cursor:pointer;border-bottom:1px solid #f5f5f5;font-size:13px;gap:8px}
.cust-drop-item:last-child{border-bottom:none}
.cust-drop-item:hover{background:#eef2ff}
.cust-drop-name{flex:1;font-weight:600;color:#222}
.cust-drop-cnt{font-size:11px;color:#888}
.cust-drop-del{background:none;border:none;color:#ccc;font-size:13px;cursor:pointer;padding:2px 5px;border-radius:4px}
.cust-drop-del:hover{background:#fee2e2;color:#e53935}
/* 날짜 메모 */
.date-label{display:flex;align-items:center;gap:4px}
.memo-btn{background:none;border:none;cursor:pointer;font-size:13px;opacity:.5;padding:0 2px}
.memo-btn:hover{opacity:1}
.memo-btn.has-memo{opacity:1;color:#f59e0b}
.date-memo-wrap{padding:4px 8px 6px;display:none}
.date-memo-wrap.open{display:block}
.date-memo-ta{width:100%;border:1px solid #e0e0e0;border-radius:6px;padding:7px 9px;font-size:12px;font-family:inherit;resize:none;color:#444;background:#fffde7;line-height:1.5}
.date-memo-ta:focus{outline:none;border-color:#f59e0b}
/* ===== 모바일 반응형 ===== */
@media (max-width: 768px) {
  /* 헤더 */
  #header{padding:8px 10px;flex-wrap:wrap;gap:4px}

<!-- 비밀번호 잠금 화면 -->
<div id="lock-screen" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#1a1a2e;display:flex;align-items:center;justify-content:center;z-index:99999">
  <div style="background:#fff;border-radius:16px;padding:40px;text-align:center;width:300px;box-shadow:0 8px 32px rgba(0,0,0,0.3)">
    <div style="font-size:40px;margin-bottom:12px">📷</div>
    <div style="font-size:18px;font-weight:700;color:#333;margin-bottom:6px">감탄사진관</div>
    <div style="font-size:13px;color:#888;margin-bottom:24px">통합관리 시스템</div>
    <input id="lock-input" type="password" placeholder="비밀번호 입력" 
      style="width:100%;border:2px solid #e0e0e0;border-radius:8px;padding:10px 14px;font-size:16px;outline:none;box-sizing:border-box;text-align:center;letter-spacing:4px"
      onkeydown="if(event.key==='Enter')checkPassword()">
    <div id="lock-error" style="color:#e53e3e;font-size:12px;margin-top:8px;height:16px"></div>
    <button onclick="checkPassword()" 
      style="width:100%;background:#7c3aed;color:#fff;border:none;border-radius:8px;padding:12px;font-size:15px;font-weight:700;cursor:pointer;margin-top:12px">
      입장
    </button>
  </div>
</div>

<script>
const APP_PASSWORD = 'gamtan3639';
function checkPassword() {
  const val = document.getElementById('lock-input').value;
  if (val === APP_PASSWORD) {
    document.getElementById('lock-screen').style.display = 'none';
    sessionStorage.setItem('gamtan_auth', '1');
  } else {
    document.getElementById('lock-error').textContent = '비밀번호가 틀렸습니다';
    document.getElementById('lock-input').value = '';
    document.getElementById('lock-input').focus();
  }
}
// 이미 인증된 경우 바로 통과
if (sessionStorage.getItem('gamtan_auth') === '1') {
  document.addEventListener('DOMContentLoaded', function() {
    const ls = document.getElementById('lock-screen');
    if (ls) ls.style.display = 'none';
  });
}
</script>

function fmtDateKo(dateStr) {
  if(!dateStr) return '';
  const d = new Date(dateStr + 'T12:00:00');
  const days = ['일','월','화','수','목','금','토'];
  return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${days[d.getDay()]}요일`;
}
// 전화번호 자동 하이픈 포맷 (010-1234-5678)
function formatPhoneInput(el) {
  let v = el.value.replace(/[^0-9]/g, '');
  if(v.startsWith('02')) {
    // 서울 지역번호 02-xxxx-xxxx
    if(v.length <= 2)       v = v;
    else if(v.length <= 6)  v = v.slice(0,2) + '-' + v.slice(2);
    else                    v = v.slice(0,2) + '-' + v.slice(2,6) + '-' + v.slice(6,10);
  } else {
    // 010, 011, 031 등 3자리 지역번호
    if(v.length <= 3)       v = v;
    else if(v.length <= 7)  v = v.slice(0,3) + '-' + v.slice(3);
    else                    v = v.slice(0,3) + '-' + v.slice(3,7) + '-' + v.slice(7,11);
  }
  el.value = v;
}
function fmtTime(t) {
  if(!t) return '';
  const [h,m] = t.split(':').map(Number);
  const isAm = h < 12;
  const color = isAm ? '#e53e3e' : '#2b6cb0';
  const hh = h===0?12:h>12?h-12:h;
  const timeText = m===0 ? `${hh}시` : `${hh}시 ${m}분`;
  return `<span style="color:${color};font-weight:700">${timeText}</span>`;
}
function addMinutes(t, mins) {
  if(!t) return '';
  const [h,m] = t.split(':').map(Number);
  const total = h*60+m+mins;
  const nh = Math.floor(total/60)%24;
  const nm = total%60;
  return fmtTime(`${String(nh).padStart(2,'0')}:${String(nm).padStart(2,'0')}`);
}

// 액자 선택 안내 텍스트 생성 (기본 액자 + 추가 주문 합산)
function buildFrameChoiceText(b) {
  initExtraItems(b);
  const goods = PRODUCT_GOODS[b.product] || PRODUCT_GOODS.story;
  const lines = [];
  let total = 0;

  // 기본 제공 액자 (원본 없는 상품 제외)
  if(goods.frame && !goods.frame.includes('없음') && !goods.frame.includes('파일')) {
    lines.push(`- ${goods.frame} → 사진 1장`);
    total += 1;
  }

  // 추가 주문 액자/앨범 (원본추가 제외)
  const frameKeys = [
    {key:'5x7액자',  label:'5×7 액자'},
    {key:'8x10액자', label:'8×10 액자'},
    {key:'11알액자', label:'11알 액자'},
    {key:'20알액자', label:'20알 액자'},
    {key:'20알슬림', label:'20알슬림'},
    {key:'8x11앨범',   label:'8×11 앨범'},
    {key:'100x70캔버스', label:'100×70 캔버스'},
  ];
  frameKeys.forEach(item => {
    const qty = parseInt(b.extraItems[item.key])||0;
    if(qty > 0) {
      lines.push(`- ${item.label} ${qty}개 → 사진 ${qty}장`);
      total += qty;
    }
  });

const PRODUCT_GOODS = {

  simpfam: {frame:'5×7 액자',   originals:'원본 30컷 이상'},

};
// 가격표 항목 중 실물 출고와 관련된 키워드
const GOODS_KEYWORDS = ['액자','앨범','원본','포켓','캔버스','인화','파일','슬림','프린트'];
function buildShippingBox(b) {
  initExtraItems(b);
  if(!b.shippingChecks) b.shippingChecks = {};
  const goods = PRODUCT_GOODS[b.product] || PRODUCT_GOODS.story;

  // 출고 목록 항목 수집 [{itemKey, icon, label, badge, badgeBg, badgeFg}]
  const items = [];

  // ① 기본 제공 항목 (액자·원본)
  if(goods.frame)     items.push({k:'frame',    icon:'🖼', label:goods.frame,    badge:'액자·원본 제공', badgeBg:'#f5f3ff', badgeFg:'#7c3aed'});
  if(goods.originals) items.push({k:'originals',icon:'💿', label:goods.originals,badge:'액자·원본 제공', badgeBg:'#f5f3ff', badgeFg:'#7c3aed'});
  if(b.reviewed)      items.push({k:'pocket',   icon:'📷', label:'포켓 사진',    badge:'리뷰 완료 제공', badgeBg:'#fef9c3', badgeFg:'#713f12'});

  // ② 가격표 추가 항목 (실물 키워드 포함)
  if(b.priceItems && b.priceItems.length) {
    b.priceItems.slice(1).forEach(r=>{
      const lc = (r.label||'').toLowerCase();
      if(GOODS_KEYWORDS.some(kw=>lc.includes(kw))) {
        items.push({k:`price_${r.id}`, icon:'➕', label:r.label, badge:'가격표 추가', badgeBg:'#eef2ff', badgeFg:'#4f46e5'});
      }
    });
  }

  // ③ extraItems (4단계 추가 주문)
  EXTRA_ITEMS.forEach(item=>{
    const qty = parseInt(b.extraItems[item.key])||0;
    if(qty>0) items.push({k:`extra_${item.key}`, icon:'📦', label:`${item.label} ${qty}${item.unit}`, badge:'추가 주문', badgeBg:'#eff6ff', badgeFg:'#0369a1'});
  });

  if(!items.length) return '';

  const ready = b.shippingReady || false;
  const done  = b.shippingDone  || false;

  // 전체 완료 여부: 모든 목록 체크 + 출고준비 + 출고완료
  const allItemsChecked = items.every(it => b.shippingChecks[it.k]);
  const allDone = allItemsChecked && ready && done;

  // 박스 스타일 (전부 완료 시 초록)
  const boxBg     = allDone ? '#f0fdf4' : '#eff6ff';
  const boxBorder = allDone ? '#86efac' : '#bfdbfe';
  const titleColor= allDone ? '#15803d' : '#1e40af';
  const titleNote = allDone
    ? `<span style="font-size:11px;font-weight:700;color:#15803d;margin-left:6px">✅ 출고 완료!</span>`
    : `<span style="font-size:11px;font-weight:400;color:#64748b">— 출고 전 반드시 확인</span>`;

  // 목록 행 렌더
  const rowsHtml = items.map(it=>{
    const checked = !!b.shippingChecks[it.k];
    return `<div onclick="toggleShippingItem('${b.id}','${it.k}')" style="display:flex;align-items:center;gap:8px;padding:7px 6px;border-bottom:1px solid ${allDone?'#bbf7d0':'#e0eaff'};cursor:pointer;user-select:none;border-radius:4px;transition:background .1s" onmouseover="this.style.background='rgba(0,0,0,.03)'" onmouseout="this.style.background=''">
      <div style="width:18px;height:18px;border-radius:4px;border:2px solid ${checked?'#059669':'#ccc'};background:${checked?'#059669':'#fff'};display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s">
        ${checked?'<span style="color:#fff;font-size:11px;font-weight:900;line-height:1">✓</span>':''}
      </div>
      <span style="font-size:14px">${it.icon}</span>
      <span style="flex:1;font-size:13px;color:${checked?'#6b7280':'#1e293b'};font-weight:600;${checked?'text-decoration:line-through;':''}">${it.label}</span>
      <span style="font-size:10px;background:${it.badgeBg};color:${it.badgeFg};border-radius:8px;padding:2px 7px;white-space:nowrap;font-weight:700">${it.badge}</span>
    </div>`;
  }).join('');

  // 출고 준비 / 출고 완료 체크 버튼
  const statusRow = (key, label, icon, checked, color) => `
    <div onclick="toggleShipping('${b.id}','${key}')" style="display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;background:${checked?color+'22':'#fff'};border:1.5px solid ${checked?color:'#ddd'};user-select:none">
      <div style="width:20px;height:20px;border-radius:5px;border:2px solid ${checked?color:'#ccc'};background:${checked?color:'#fff'};display:flex;align-items:center;justify-content:center;flex-shrink:0">
        ${checked?`<span style="color:#fff;font-size:13px;font-weight:900">✓</span>`:''}
      </div>
      <span style="font-size:13px;font-weight:700;color:${checked?color:'#666'}">${icon} ${label}</span>
      ${checked?`<span style="margin-left:auto;font-size:11px;color:${color};font-weight:700">완료</span>`:''}
    </div>`;

  return `<div id="shipping-box-${b.id}" style="background:${boxBg};border:1.5px solid ${boxBorder};border-radius:10px;padding:12px 14px;margin-bottom:14px;transition:all .3s">
    <div style="font-size:13px;font-weight:700;color:${titleColor};margin-bottom:10px">📦 출고 목록 ${titleNote}</div>
    ${rowsHtml}
    <div style="margin-top:12px;display:flex;flex-direction:column;gap:6px">
      ${statusRow('shippingReady','출고 준비','🗂️', ready, '#f59e0b')}
      ${statusRow('shippingDone', '출고 완료','✅',  done,  '#059669')}
    </div>
  </div>`;
}

function calcBookingPrice(b) {
  const rows = [];
  let total = 0;
  function add(label, amt, plus=false) { rows.push({label,amt,plus}); total+=amt; }
  const adults = parseInt(b.adults)||0;
  const kids = parseInt(b.kids)||0;
  const pet = b.pet||false;
  const weekend = b.weekend||false;
  if(b.product==='story') {
    add('감탄스토리 기본 (2인)', 250000);
    if(adults>2) add(`성인 ${adults-2}인 추가`,(adults-2)*100000,true);
    if(kids>0) add(`미성년 자녀 ${kids}인 추가`,kids*50000,true);
    if(pet) add('반려동물 추가',50000,true);
  } else if(b.product==='simpfam') {
    add('감탄 심플패밀리 기본 (2인)', 100000);
    if(adults>2) add(`성인 ${adults-2}인 추가`,(adults-2)*50000,true);
    if(kids>0) add(`미성년 자녀 ${kids}인 추가`,kids*30000,true);
    if(pet) add('반려동물 추가',30000,true);
  } else if(b.product==='bigfam') {
    const bigfamUpgrade = !!(b.bigfamUpgrade);
    if(bigfamUpgrade) {
      add('감탄 대가족 → 감탄스토리 전환', 0);
      add('기본 (성인 2인)', 250000);
      if(adults > 2) add(`성인 ${adults-2}인 추가`, (adults-2)*100000, true);
      if(kids > 0)   add(`미성년 ${kids}인 추가`,    kids*50000, true);
      if(weekend)    add('주말·공휴일 추가', 50000, true);
      // 선택된 앨범 옵션
      const albumKey = b.bigfamAlbum || '20al';
      const album = BIGFAM_ALBUMS.find(a=>a.key===albumKey) || BIGFAM_ALBUMS[2];
      add(`${album.label} (정가 ${fmtPrice(album.origAmt)} → 50% 할인)`, album.discAmt, true);
    } else {
      add('감탄 대가족 (15인 이하)', 150000);
    }
    if(pet) add('반려동물 추가',50000,true);
  } else if(b.product==='growth') {
    add('가족성장 프로젝트 (매년)', 150000);
  } else if(b.product==='kids') {
    add('베이비&키즈 프로필 (1인)', 150000);
    if(weekend) add('주말·공휴일 추가',50000,true);
  } else if(b.product==='profile') {
    add('감탄 프로필 (1인)', 100000);
    if(weekend) add('주말·공휴일 추가',50000,true);
  } else if(b.product==='jangsu') {
    add('부모님 장수 프로필', 200000);
  } else if(b.product==='id') {
    const idT = ID_TYPES.find(x=>x.key===(b.idType||'passport'))||ID_TYPES[0];
    const idCount = Math.max(1, parseInt(b.adults)||1);
    add(idT.name + (idCount > 1 ? ` (${idCount}인)` : ''), idT.amt * idCount);
    if(b.idPassportAdd) add('여권 추가' + (idCount > 1 ? ` (${idCount}인)` : ''), 10000 * idCount, true);
    if(b.idIdCardAdd)   add('주민증 추가' + (idCount > 1 ? ` (${idCount}인)` : ''), 10000 * idCount, true);
    if(b.idWebFile)     add('인터넷 제출용 웹파일' + (idCount > 1 ? ` (${idCount}인)` : ''), 5000 * idCount, true);
  }
  return {rows,total};
}

function referrerDisplayName(refStr) {
  if(!refStr) return '';
  return refStr.replace(/\s*\(.*?\)$/, '').trim();
}
// 추천인 표시용: 전화번호 추출
function referrerPhone(refStr) {
  if(!refStr) return '';
  const m = refStr.match(/\(([^)]+)\)/);
  return m ? m[1] : '';
}
// 추천인으로 고객 찾기 (이름+전화번호 또는 이름만)
function findCustByReferrerStr(refStr) {
  const dname = referrerDisplayName(refStr);
  const phone = referrerPhone(refStr);
  const custMap = {};
  bookings.forEach(b=>{ if(!custMap[b.name]) custMap[b.name]={name:b.name,phone:b.phone||''}; });
  const matches = Object.values(custMap).filter(c=> c.name === dname);
  if(matches.length === 1) return matches[0].name;
  if(phone) { const exact = matches.find(c=> (c.phone||'').replace(/-/g,'') === phone.replace(/-/g,'')); if(exact) return exact.name; }
  return dname; // fallback
}

      const d = JSON.parse(json.payload);
      applyAllData(d);
      showSyncStatus('✅ 최신 데이터');
      return true;
    }
    showSyncStatus('✅ 연결됨');
  } catch(e) {
    showSyncStatus('⚠️ 오프라인 모드');
  }
  return false;
}

function initPriceItems(b) {
  if(!b.priceItems) {

function priceTotal(b) {
  const base  = (b.priceItems||[]).reduce((s,r)=>s+Number(r.amt),0);
  const extra = (b.extraCharges||[]).reduce((s,r)=>s+Number(r.amt),0);
  return base + extra;
}

      deposit: {amt: 0, method:'계좌이체'},

    };
    saveBookings();
  }

function paidTotal(b) {
  const d = Number(b.payments?.deposit?.amt||0);
  const m = (b.payments?.midterms||[]).reduce((s,r)=>s+Number(r.amt),0);
  return d + m;
}
function updatePriceUI(bid) {
  const b = bookings.find(x=>x.id===bid);
  if(!b) return;
  const total = priceTotal(b);
  const paid  = paidTotal(b);
  const mid   = (b.payments?.midterms||[]).reduce((s,r)=>s+Number(r.amt),0);
  const remain = total - paid;
  const set = (id,v)=>{ const el=document.getElementById(id); if(el) el.textContent=v; };
  set(`pt-total-${bid}`,    fmtPrice(total));
  set(`pt-dep-${bid}`,      fmtPrice(Number(b.payments?.deposit?.amt||0)));
  set(`pt-mid-${bid}`,      fmtPrice(mid));
  set(`pt-paid-sum-${bid}`, fmtPrice(paid));
  set(`pt-remain-${bid}`,   fmtPrice(Math.max(0,remain)));
  const rv  = document.getElementById(`pt-remain-val-${bid}`);
  const rlb = document.getElementById(`pt-remain-lbl-${bid}`);
  const noAmt   = total <= 0;
  const unpaid  = isUnpaid(b);
  const isPaid  = !noAmt && !unpaid && remain <= 0;
  if(rv)  {
    rv.style.color = noAmt ? '#9ca3af' : (unpaid || remain > 0) ? '#dc2626' : '#15803d';
    rv.textContent = noAmt ? '금액 미설정' : unpaid ? '⚠️ 미입금' : fmtPrice(Math.max(0,remain)) + (isPaid ? ' ✅' : '');
  }
  if(rlb) {
    rlb.textContent = noAmt ? '미설정' : unpaid ? '미입금' : isPaid ? '완납' : '잔금';
    rlb.style.color = noAmt ? '#9ca3af' : unpaid ? '#be123c' : isPaid ? '#166534' : '#be123c';
  }
  const rc = document.getElementById(`pt-remain-card-${bid}`);
  if(rc) rc.style.background = noAmt ? '#f9fafb' : isPaid ? '#f0fdf4' : '#fff1f2';
  // 한줄 요약 카드 갱신
  const depShowEl = document.getElementById(`pt-dep-show-${bid}`);
  if(depShowEl) depShowEl.textContent = fmtPrice(d);
  const midShowEl = document.getElementById(`pt-mid-show-${bid}`);
  if(midShowEl) midShowEl.textContent = fmtPrice(m);
  // 예약금 입금확인 체크박스 동기화
  const confirmed = !!b.stageChecks?.[1]?.[0];
  const row = document.getElementById(`dep-confirm-row-${bid}`);
  const cb  = document.getElementById(`dep-confirm-cb-${bid}`);
  const lbl = document.getElementById(`dep-confirm-lbl-${bid}`);
  if(row) row.style.background = confirmed ? '#f0fdf4' : '#fff8f8';
  if(cb) {
    cb.style.border = `2px solid ${confirmed?'#16a34a':'#dc2626'}`;
    cb.style.background = confirmed ? '#16a34a' : '#fff';
    cb.innerHTML = confirmed ? '<span style="color:#fff;font-size:13px;font-weight:900">✓</span>' : '';
  }
  if(lbl) {
    lbl.style.color = confirmed ? '#16a34a' : '#dc2626';
    lbl.textContent = confirmed ? '✅ 예약금 입금 확인됨' : '⚠️ 예약금 미입금 — 클릭하여 확인';
  }
}

function editMidtermAmt(bid, mid_id, val) {
  const b = bookings.find(x=>x.id===bid);
  if(!b||!b.payments) return;
  const m = b.payments.midterms.find(r=>r.id===mid_id);
  if(m) { m.amt = parseInt(val.replace(/[^0-9]/g,''))||0; saveBookings(); updatePriceUI(bid); }
}
function editMidtermMethod(bid, mid_id, val) {
  const b = bookings.find(x=>x.id===bid);
  if(!b||!b.payments) return;
  const m = b.payments.midterms.find(r=>r.id===mid_id);
  if(m) { m.method = val; saveBookings(); }
}
function toggleMidtermPaid(bid, mid, checked) {
  const b = bookings.find(x=>x.id===bid);
  if(!b||!b.payments) return;
  const m = b.payments.midterms.find(x=>x.id===mid);
  if(!m) return;
  m.paid = checked;
  saveBookings();
  const row = document.getElementById(`midterm-row-${bid}-${mid}`);
  if(row) row.innerHTML = midtermRowHtml(bid, m);
}
function deleteMidterm(bid, mid_id) {
  const b = bookings.find(x=>x.id===bid);
  if(!b||!b.payments) return;
  b.payments.midterms = b.payments.midterms.filter(r=>r.id!==mid_id);
  saveBookings();
  const row = document.getElementById(`midterm-row-${bid}-${mid_id}`);
  if(row) row.remove();
  updatePriceUI(bid);
}
function setFullPayment(bid) {
  const b = bookings.find(x=>x.id===bid);
  if(!b||!b.payments) return;
  const total  = priceTotal(b);
  const depAmt = Number(b.payments.deposit.amt||0);
  const remain = total - depAmt;
  // 예약금 외 잔금이 있으면 납입금으로 추가
  if(remain > 0) {
    b.payments.midterms = [{id: Date.now(), amt: remain, method: b.payments.deposit.method||'계좌이체'}];
  } else {
    b.payments.midterms = [];
  }
  // 입금확인 체크 자동 처리
  if(!b.stageChecks) b.stageChecks = {};
  if(!b.stageChecks[1]) b.stageChecks[1] = {};
  b.stageChecks[1][0] = true;
  if((b.currentStage||0) < 1) b.currentStage = 1;
  saveBookings();
  updatePriceUI(bid);
  refreshHistAmt(bid, b.name);
}
function methodSelect(bid, onChange, selected) {
  return `<select onchange="${onChange}" style="border:1px solid #e0e0e0;border-radius:5px;padding:3px 5px;font-size:12px;font-family:inherit;background:#fff">
    ${METHODS.map(m=>`<option value="${m}"${m===selected?' selected':''}>${m}</option>`).join('')}
  </select>`;
}
function midtermRowHtml(bid, m) {
  const paid = !!(m.paid);
  const methodOpts = ['계좌이체','카드','현금','제로페이'].map(v=>
    `<option value="${v}" ${(m.method||'계좌이체')===v?'selected':''}>${v}</option>`
  ).join('');
  return `<div style="display:flex;align-items:center;gap:6px;padding:8px 12px;border-top:1px solid #f0f0f0;background:#f8fbff">
    <span style="font-size:11px;font-weight:700;color:#0891b2;min-width:42px">납입금</span>
    <input type="text" value="${Number(m.amt).toLocaleString('ko-KR')}" oninput="editMidtermAmt('${bid}',${m.id},this.value)"
      style="flex:1;min-width:60px;border:1px solid #bae6fd;border-radius:6px;padding:4px 8px;font-size:13px;text-align:right;font-family:inherit">
    <span style="font-size:11px;color:#888">원</span>
    <select onchange="editMidtermMethod('${bid}',${m.id},this.value)" onclick="event.stopPropagation()"
      style="border:1px solid #e0e0e0;border-radius:5px;padding:3px 5px;font-size:12px;font-family:inherit;background:#fff">
      ${methodOpts}
    </select>
    <label onclick="event.stopPropagation()" style="display:flex;align-items:center;gap:4px;cursor:pointer;white-space:nowrap;padding:4px 8px;border-radius:6px;border:1.5px solid ${paid?'#15803d':'#d1d5db'};background:${paid?'#f0fdf4':'#fff'}">
      <input type="checkbox" ${paid?'checked':''} onclick="event.stopPropagation();toggleMidtermPaid('${bid}',${m.id},this.checked)"
        style="width:14px;height:14px;cursor:pointer;accent-color:#15803d">
      <span style="font-size:11px;font-weight:700;color:${paid?'#15803d':'#6b7280'}">납입완료</span>
    </label>
    <button onclick="deleteMidterm('${bid}',${m.id})" style="background:none;border:none;color:#ccc;font-size:17px;cursor:pointer;padding:0 2px;line-height:1">✕</button>
  </div>`;
}

// ---- 단골 고객 ----
function addCustomer(name) {
  if(!name) return;
  if(!customers.includes(name)) { customers.push(name); saveCustomers(); }
  getCustNo(name); // 고객번호 자동 부여
}
function removeCustomer(name) {
  customers = customers.filter(c=>c!==name);
  saveCustomers();
  renderCustomerDrop('');
}
function bookingCountFor(name) {
  return bookings.filter(b=>b.name===name).length;
}
function selectCustomer(name) {
  document.getElementById('f-name').value = name;
  // 기존 예약에서 전화번호/가족이름 자동 채우기
  const existing = bookings.filter(b=>b.name===name).sort((a,b)=>b.date.localeCompare(a.date));
  if(existing.length) {
    const latest = existing[0];
    if(latest.phone && !document.getElementById('f-phone').value) { const _fp=document.getElementById('f-phone'); _fp.value=latest.phone; formatPhoneInput(_fp); }
    if(latest.email && !document.getElementById('f-email').value) document.getElementById('f-email').value = latest.email;
    if(latest.familyNames && !document.getElementById('f-familynames').value) document.getElementById('f-familynames').value = latest.familyNames;
  }
  hideCustomerDrop();
}
function renderCustomerDrop(filter) {
  const inner = document.getElementById('customer-drop-inner');
  const empty = document.getElementById('customer-drop-empty');
  if(!inner) return;
  const filtered = filter ? customers.filter(c=>c.includes(filter)) : customers;
  if(!filtered.length) {
    inner.innerHTML=''; empty.style.display='block'; return;
  }
  empty.style.display='none';
  inner.innerHTML = filtered.map(c=>`
    <div class="cust-drop-item" onmousedown="selectCustomer('${c.replace(/'/g,"\\'")}')">
      <span class="cust-drop-name">👤 ${c}</span>
      <span class="cust-drop-cnt">${bookingCountFor(c)}회 방문</span>
      <button class="cust-drop-del" onmousedown="event.stopPropagation();removeCustomer('${c.replace(/'/g,"\\'")}')">✕</button>
    </div>`).join('');
}
function showCustomerDrop() {
  const drop = document.getElementById('customer-drop');
  if(!drop || !customers.length) return;
  renderCustomerDrop(document.getElementById('f-name').value);
  drop.style.display='block';
}
function hideCustomerDrop() {
  const drop = document.getElementById('customer-drop');
  if(drop) drop.style.display='none';
}
function toggleCustomerDrop() {
  const drop = document.getElementById('customer-drop');
  if(!drop) return;
  if(drop.style.display==='none' || !drop.style.display) { renderCustomerDrop(''); drop.style.display='block'; }
  else drop.style.display='none';
}
function filterCustomerDrop(val) {
  const drop = document.getElementById('customer-drop');
  if(!drop || !customers.length) return;
  renderCustomerDrop(val);
  drop.style.display='block';
}
function updateCustomerChips() { renderCustomerDrop(''); }

function toggleDateMemo(date) {
  const body = document.getElementById('memo-body-'+date);
  const chev = document.getElementById('memo-chev-'+date);
  if(!body) return;
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  if(chev) chev.textContent = !isOpen ? '▲' : '▼';
  if(!isOpen) { const ta = body.querySelector('textarea'); if(ta) ta.focus(); }
}
function saveVisitNote(bid, val) {
  const b = bookings.find(x=>x.id===bid);
  if(!b) return;
  b.visitNote = val;
  saveBookings();
  // 월간 캘린더가 열려 있으면 해당 날짜 셀만 실시간 갱신
  if(currentView === 'month') {
    clearTimeout(saveVisitNote._t);
    saveVisitNote._t = setTimeout(renderMonthCal, 400);
  }
}
// 메모 줄 클릭 → textarea로 전환, 포커스 벗어나면 저장 후 복귀
function histMemoEdit(bid, rowEl) {
  const b = bookings.find(x=>x.id===bid);
  if(!b) return;
  const ta = document.createElement('textarea');
  ta.value = b.memo || '';
  ta.rows = 3;
  ta.style.cssText = 'width:100%;box-sizing:border-box;border:none;background:transparent;font-size:12px;color:#92400e;resize:none;font-family:inherit;outline:none;line-height:1.7;flex:1';
  // 저장 & 복귀
  function finish() {
    b.memo = ta.value;
    saveBookings();
    const txt = ta.value.trim();
    rowEl.style.display = txt ? 'flex' : 'none';
    const span = rowEl.querySelector('.hist-memo-text');
    if(span) span.textContent = txt;
    // textarea 제거, 텍스트 스팬 다시 보이기
    rowEl.innerHTML = `<span style="font-size:11px;color:#b45309;font-weight:700;flex-shrink:0;margin-top:1px">📝</span>
      <span class="hist-memo-text" style="font-size:12px;color:#92400e;line-height:1.5;white-space:pre-wrap;word-break:break-all;flex:1">${escHtml(txt)}</span>
      <span style="font-size:10px;color:#d97706;flex-shrink:0;margin-top:1px;opacity:.6">✏️</span>`;
    rowEl.onclick = function(){ histMemoEdit(bid, rowEl); };
  }
  ta.onblur = finish;
  ta.onkeydown = function(e) {
    if(e.key==='Escape') { ta.value = b.memo||''; finish(); }
  };
  // 텍스트 스팬 숨기고 textarea 삽입
  rowEl.innerHTML = '<span style="font-size:11px;color:#b45309;font-weight:700;flex-shrink:0;margin-top:1px">📝</span>';
  rowEl.appendChild(ta);
  rowEl.onclick = null;
  setTimeout(()=>{ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }, 0);
}
function saveMemo(id, ta) {
  const b = bookings.find(x=>x.id===id);
  if(!b) return;
  b.memo = ta.value;
  saveBookings();
  // 항상 보이는 메모 줄 즉시 갱신
  const memoRow = document.getElementById('hist-memo-row-' + id);
  if(memoRow) {
    const txt = ta.value.trim();
    if(txt) {
      memoRow.style.display = 'flex';
      const span = memoRow.querySelector('.hist-memo-text');
      if(span) span.textContent = txt;
    } else {
      memoRow.style.display = 'none';
    }
  }
}

function renderCustSearch() {
  const cr = document.getElementById('cust-search-result');
  if(!cr) return;
  const q = (document.getElementById('cust-search-input')?.value||'').trim().toLowerCase();
  // 고유 고객 이름 목록 (마지막 예약 날짜 기준 정렬)
  const custMap = {};
  bookings.forEach(b=>{
    if(!custMap[b.name]) custMap[b.name] = {name:b.name, phone:b.phone||'', lastDate:'', count:0};
    custMap[b.name].count++;
    if(!b.cancelled && b.date > (custMap[b.name].lastDate||'')) custMap[b.name].lastDate = b.date;
  });
  let custs = Object.values(custMap);
  if(q) custs = custs.filter(c=> c.name.toLowerCase().includes(q) || (c.phone||'').replace(/-/g,'').includes(q.replace(/-/g,'')));
  custs.sort((a,b)=> (b.lastDate||'').localeCompare(a.lastDate||''));

  if(!custs.length) {
    cr.innerHTML = `<div style="text-align:center;color:#bbb;padding:30px;font-size:14px">${q?'검색 결과 없음':'고객 이름을 검색하세요'}</div>`;
    return;
  }
  cr.innerHTML = `<div style="padding:6px 8px;display:flex;flex-direction:column;gap:4px">` +
    custs.map(c=>{
      const safeName = c.name.replace(/'/g,"\\'");
      const cx = getCustExtra(safeName);
      const motiveTag = cx.visitMotive ? `<span style="font-size:10px;background:#e0f2fe;color:#0369a1;border-radius:4px;padding:1px 5px">${escHtml(cx.visitMotive)}</span>` : '';
      return `<div onclick="selectCustFromPopup('${safeName}')"
        style="display:flex;align-items:center;gap:8px;padding:9px 12px;background:#fff;border:1px solid #e5e7eb;border-radius:9px;cursor:pointer;transition:background .1s"
        onmouseover="this.style.background='#f0f0ff'" onmouseout="this.style.background='#fff'">
        <div style="width:36px;height:36px;border-radius:50%;background:#6366f1;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;flex-shrink:0">${escHtml(c.name.slice(0,1))}</div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
            <span style="font-size:15px;font-weight:800;color:#1a1a2e">${escHtml(c.name)}</span>
            ${c.phone?`<span style="font-size:12px;color:#6b7280">${c.phone}</span>`:''}
            ${motiveTag}
          </div>
          <div style="font-size:12px;color:#9ca3af;margin-top:1px">방문 ${c.count}회${c.lastDate?' · 최근 '+fmtDateKo(c.lastDate):''}</div>
        </div>
        <span style="font-size:18px;color:#c7d2fe">›</span>
      </div>`;
    }).join('') + `</div>`;
}

function renderCustSearchPopup() {
  const cr = document.getElementById('cust-popup-result');
  if(!cr) return;
  const q = (document.getElementById('cust-popup-input')?.value||'').trim();
  const qLow = q.toLowerCase();

  const custMap = {};
  bookings.forEach(b=>{
    if(!custMap[b.name]) custMap[b.name] = {name:b.name, phone:b.phone||'', lastDate:'', count:0};
    if(!b._phonePlaceholder) custMap[b.name].count++;
    if(!b.cancelled && !b._phonePlaceholder && b.date > (custMap[b.name].lastDate||'')) custMap[b.name].lastDate = b.date;
    if(b.phone && !custMap[b.name].phone) custMap[b.name].phone = b.phone;
  });
  let custs = Object.values(custMap);

  if(q) {
    const qDigits = q.replace(/[^0-9]/g,'');
    custs = custs.filter(c=>{
      const nameMatch = c.name.toLowerCase().includes(qLow);
      const phoneDigits = (c.phone||'').replace(/[^0-9]/g,'');
      const phoneMatch = qDigits.length >= 3 && (
        qDigits.length >= 4
          ? phoneDigits.endsWith(qDigits)   // 4자리 이상은 끝자리 매칭
          : phoneDigits.includes(qDigits)   // 3자리 이하는 포함 매칭
      );
      return nameMatch || phoneMatch;
    });
  }
  custs.sort((a,b)=>(b.lastDate||'').localeCompare(a.lastDate||''));

  if(!custs.length) {
    if(!q) {
      const hasRealBookings = bookings.filter(b=>!b._phonePlaceholder).length > 0;
      if(!hasRealBookings) {
        showNewCustForm(cr, '', false);
      } else {
        cr.innerHTML = '<div style="text-align:center;color:#bbb;padding:40px;font-size:14px">이름 또는 전화번호 뒷자리를 입력하세요</div>';
      }
      return;
    }
    const isPhone = /^[0-9\-]+$/.test(q) && !/[가-힣a-zA-Z]/.test(q);
    showNewCustForm(cr, q, isPhone);
    return;
  }

  const items = custs.map(c=>{
    const cx = getCustExtra(c.name);
    const motiveTag = cx.visitMotive
      ? '<span style="font-size:10px;background:#e0f2fe;color:#0369a1;border-radius:4px;padding:1px 5px">' + escHtml(cx.visitMotive) + '</span>'
      : '';
    const el = document.createElement('div');
    el.style.cssText = 'display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;transition:background .1s';
    el.onmouseover = function(){ this.style.background='#f0f0ff'; };
    el.onmouseout  = function(){ this.style.background=''; };
    el.onclick = (function(name){ return function(){ selectCustFromPopup(name); }; })(c.name);
    el.innerHTML =
      '<div style="width:38px;height:38px;border-radius:50%;background:#6366f1;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;flex-shrink:0">' + escHtml(c.name.slice(0,1)) + '</div>' +
      '<div style="flex:1;min-width:0">' +
        '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">' +
          '<span style="font-size:15px;font-weight:800;color:#1a1a2e">' + escHtml(c.name) + '</span>' +
          (c.phone ? '<span style="font-size:12px;color:#6b7280">' + escHtml(c.phone) + '</span>' : '') +
          motiveTag +
        '</div>' +
        '<div style="font-size:12px;color:#9ca3af;margin-top:2px">방문 ' + c.count + '회' + (c.lastDate ? ' · 최근 ' + fmtDateKo(c.lastDate) : '') + '</div>' +
      '</div>' +
      '<span style="font-size:20px;color:#c7d2fe">›</span>';
    return el;
  });

  cr.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;flex-direction:column;gap:4px';
  items.forEach(el => wrap.appendChild(el));
  cr.appendChild(wrap);
}

// 검색어를 이름 필드로 옮기는 버튼 핸들러
function fillNewCustFromSearch() {
  const searchVal = (document.getElementById('cust-popup-input')?.value||'').trim();
  const isPhone = /^[0-9\-]+$/.test(searchVal) && !/[가-힣a-zA-Z]/.test(searchVal);
  const nameEl  = document.getElementById('popup-new-name');
  const phoneEl = document.getElementById('popup-new-phone');
  if(!searchVal) return;
  if(isPhone) {
    if(phoneEl) { phoneEl.value = searchVal; formatPhoneInput(phoneEl); phoneEl.focus(); }
  } else {
    if(nameEl) { nameEl.value = searchVal; nameEl.focus(); }
  }
}
function saveNewCustFromPopup() {
  const nameEl  = document.getElementById('popup-new-name');
  const phoneEl = document.getElementById('popup-new-phone');
  const memoEl  = document.getElementById('popup-new-memo');
  let name  = (nameEl?.value  || '').trim();
  const phone = (phoneEl?.value || '').trim();
  const memo  = (memoEl?.value  || '').trim();
  // 이름이 비면 검색창 값 사용 (전화번호가 아닌 경우)
  if(!name) {
    const searchQ = (document.getElementById('cust-popup-input')?.value||'').trim();
    const searchIsPhone = /^[0-9\-]+$/.test(searchQ) && !/[가-힣a-zA-Z]/.test(searchQ);
    if(!searchIsPhone && searchQ) name = searchQ;
  }
  if(!name) {
    if(!phone) { if(nameEl){nameEl.style.border='1.5px solid #ef4444';nameEl.focus();} return; }
    name = phone;
  }
  const exists = bookings.some(b => b.name === name);
  if(exists) {
    const allBksE   = bookings.filter(b=>b.name===name);
    const existBks  = allBksE.filter(b=>!b._phonePlaceholder);
    const existPhone= allBksE.map(x=>x.phone).filter(Boolean).pop()||'';
    const existCount= existBks.length;
    const existLast = allBksE.map(x=>x.date).sort().pop()||'';
    const sameNames = [...new Set(bookings.map(b=>b.name))].filter(n=> n===name || n.startsWith(name+' ('));
    const nextNum   = sameNames.length + 1;
    const newName   = name + ' (' + nextNum + ')';
    const cr2 = document.getElementById('cust-popup-result');
    // 클릭 핸들러에 쓸 데이터는 전역 임시 변수로 저장해 따옴표 이탈 문제 방지
    window._popupPending = {name, phone, memo, newName};
    if(cr2) cr2.innerHTML =
      '<div style="padding:14px">' +
        '<div style="background:#fef9c3;border:1.5px solid #fbbf24;border-radius:12px;padding:16px">' +
          '<div style="font-size:14px;font-weight:800;color:#92400e;margin-bottom:10px">⚠️ 같은 이름의 고객이 이미 있어요</div>' +
          '<div style="background:#fff;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px;color:#374151">' +
            '<div style="font-weight:700;font-size:15px;color:#1a1a2e;margin-bottom:4px">' + escHtml(name) + '</div>' +
            (existPhone ? '<div style="color:#6b7280">📞 ' + existPhone + '</div>' : '') +
            '<div style="color:#6b7280">방문 ' + existCount + '회' + (existLast ? ' · 최근 ' + fmtDateKo(existLast) : '') + '</div>' +
          '</div>' +
          '<div style="display:flex;flex-direction:column;gap:8px">' +
            '<button onclick="doGoExistCust(window._popupPending.name,window._popupPending.phone,window._popupPending.memo)" ' +
              'style="width:100%;background:#6366f1;color:#fff;border:none;border-radius:8px;padding:10px;font-size:13px;font-weight:700;cursor:pointer">' +
              '✅ 같은 고객입니다 → 기존 카드로 이동' +
            '</button>' +
            '<button onclick="doRegNewCust(window._popupPending.newName,window._popupPending.phone,window._popupPending.memo)" ' +
              'style="width:100%;background:#ea580c;color:#fff;border:none;border-radius:8px;padding:10px;font-size:13px;font-weight:700;cursor:pointer">' +
              '👤 다른 사람입니다 → &ldquo;' + escHtml(newName) + '&rdquo;으로 새 등록' +
            '</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    return;
  }
  doRegNewCust(name, phone, memo);
}

// 기존 고객으로 이동 (전화번호만 업데이트)
function doGoExistCust(name, phone, memo) {
  if(phone) {
    const latest = bookings.filter(b=>b.name===name).sort((a,b)=>b.date.localeCompare(a.date))[0];
    if(latest && !latest.phone) { latest.phone = phone; saveBookings(); }
  }
  if(memo) { custMemos[name] = (custMemos[name] ? custMemos[name]+'\n' : '') + memo; saveCustMemos(); }
  const cr2 = document.getElementById('cust-popup-result');
  if(cr2) cr2.innerHTML = '';
  stageFilter = null;
  openCustGroups[name] = true;
  selectCustFromPopup(name);
}

// 신규 고객 실제 등록
function doRegNewCust(name, phone, memo) {
  const id = 'cust_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
  const todayStr = new Date().toISOString().slice(0,10);
  bookings.push({
    id, name, phone: phone || '',
    date: todayStr, time: new Date().toTimeString().slice(0,5),
    product: 'story', stage: 0,
    priceItems: [], payments: [],
    stageChecks: {},
    _phonePlaceholder: true,
    cancelled: false
  });
  saveBookings();
  if(memo) { custMemos[name] = (custMemos[name] ? custMemos[name]+'\n' : '') + memo; saveCustMemos(); }
  const cr2 = document.getElementById('cust-popup-result');
  if(cr2) cr2.innerHTML = '';
  stageFilter = null;
  openCustGroups[name] = true;
  // 활동 기록에 상담 로그 자동 추가 (selectCustFromPopup 이후 렌더 반영을 위해 setTimeout)
  const logText = '📞 전화 상담 등록' + (phone ? ' — ' + phone : '') + (memo ? ' / ' + memo : '');
  addCustLog(name, logText);
  selectCustFromPopup(name);
  // 로그 저장 후 고객 카드 재렌더링
  setTimeout(()=>{ try{ showCustDetail(name); }catch(e){} }, 120);
}

// ─── 가족성장 알림 바 ──────────────────────────────────────────────
function renderGrowthAlerts() {
  const bar = document.getElementById('growth-alert-bar');
  if(!bar) return;

  const today = new Date();
  today.setHours(0,0,0,0);
  const oneYearAgo = new Date(today); oneYearAgo.setFullYear(oneYearAgo.getFullYear()-1);

  // 1) 날짜 미정인 가족성장 예약
  const tbdList = bookings.filter(b=>b.product==='growth'&&b.dateTbd&&!b.cancelled);

  // 2) 마지막 촬영 후 1년 이상 경과했는데 다음 연도 예약 없는 고객
  // 같은 contractId 그룹에서 가장 최신 연도 예약이 1년 이상 지났고, 다음 연도 예약이 없는 경우
  const overdueList = [];
  const seen = new Set();
  bookings.filter(b=>b.product==='growth'&&!b.dateTbd&&!b.cancelled&&b.contractId&&b.date).forEach(b=>{
    if(seen.has(b.contractId)) return;
    // 같은 계약 내 최고 연차 예약 (날짜 있고 취소 안 된 것)
    const group = bookings.filter(x=>x.contractId===b.contractId&&!x.cancelled&&!x.dateTbd&&x.date);
    const maxYr = group.reduce((mx,x)=>Math.max(mx,x.contractYear||1),0);
    const latest = group.find(x=>(x.contractYear||1)===maxYr);
    if(!latest) return;
    const totalYrs = latest.contractYears||5;
    // 계약 완료(마지막 연차)는 알림 불필요
    if(maxYr >= totalYrs) { seen.add(b.contractId); return; }
    // 촬영일이 1년 이상 경과했는지
    const shotDate = new Date(latest.date);
    if(shotDate > oneYearAgo) { seen.add(b.contractId); return; }
    // 다음 연도 예약이 이미 있는지 (취소 포함 전체)
    const hasNext = bookings.some(x=>x.contractId===b.contractId&&(x.contractYear||1)===maxYr+1&&!x.cancelled);
    if(hasNext) { seen.add(b.contractId); return; }
    seen.add(b.contractId);
    overdueList.push({name:latest.name, yr:maxYr, totalYrs, date:latest.date, id:latest.id});
  });

  if(!tbdList.length && !overdueList.length) { bar.innerHTML=''; return; }

  let html = `<div style="padding:8px 10px;display:flex;flex-direction:column;gap:6px">`;

  if(tbdList.length) {
    html += `<div style="background:#fdf2f8;border:1.5px dashed #f9a8d4;border-radius:10px;padding:8px 12px">
      <div style="font-size:12px;font-weight:700;color:#be185d;margin-bottom:5px">🌱 날짜 미정 가족성장 예약 (${tbdList.length}건)</div>
      <div style="display:flex;flex-direction:column;gap:4px">
      ${tbdList.map(b=>{
        const safeName = b.name.replace(/'/g,"\\'");
        const curYr = b.contractYear||1;
        const totalYrs = b.contractYears||5;
        return `<div style="display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:7px;padding:5px 9px;border:1px solid #f9a8d4">
          <span style="font-size:12px;color:#1a1a2e;font-weight:600">${escHtml(b.name)} <span style="color:#be185d;font-size:11px">${totalYrs}년 계약·${curYr}년차</span></span>
          <button onclick="showCustDetail('${safeName}')" style="font-size:11px;background:#db2777;color:#fff;border:none;border-radius:6px;padding:3px 9px;cursor:pointer;font-weight:600">📅 날짜 확정</button>
        </div>`;
      }).join('')}
      </div>
    </div>`;
  }

  if(overdueList.length) {
    html += `<div style="background:#fff7ed;border:1.5px solid #fed7aa;border-radius:10px;padding:8px 12px">
      <div style="font-size:12px;font-weight:700;color:#c2410c;margin-bottom:5px">⏰ 1년 경과 — 다음 예약 필요 (${overdueList.length}건)</div>
      <div style="display:flex;flex-direction:column;gap:4px">
      ${overdueList.map(item=>{
        const safeName = item.name.replace(/'/g,"\\'");
        return `<div style="display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:7px;padding:5px 9px;border:1px solid #fed7aa">
          <span style="font-size:12px;color:#1a1a2e;font-weight:600">${escHtml(item.name)} <span style="color:#c2410c;font-size:11px">${item.totalYrs}년 계약·${item.yr}년차 완료 (${fmtDateKo(item.date)})</span></span>
          <button onclick="showCustDetail('${safeName}')" style="font-size:11px;background:#f97316;color:#fff;border:none;border-radius:6px;padding:3px 9px;cursor:pointer;font-weight:600">➕ 예약 추가</button>
        </div>`;
      }).join('')}
      </div>
    </div>`;
  }

  html += `</div>`;
  bar.innerHTML = html;
}

function toggleStageFilter(stage) {
  // 숫자로 전달된 경우 숫자로 변환 (5, 7), 문자열은 그대로 ('unpaid')
  const val = (stage === '5' || stage === '7') ? parseInt(stage) : stage;
  stageFilter = (stageFilter === val) ? null : val;
  renderAll();
}

let mcYear = new Date().getFullYear();
let mcMonth = new Date().getMonth(); // 0-based

// ====================== 뒤로/앞으로 가기 ======================
let _historyPushing = false; // popstate 처리 중 중복 push 방지

function pushNav(state) {
  if(_historyPushing) return;
  history.pushState(state, '');
}

function applyNavState(state) {
  if(!state) { _applyView('month', null, null); return; }
  _historyPushing = true;
  try {
    if(state.view === 'cust' && state.custName) {
      _applyView('cust', state.custName, null);
    } else if(state.bookingId) {
      _applyView(state.view || 'date', null, state.bookingId);
    } else {
      _applyView(state.view || 'month', null, null);
    }
  } finally {
    _historyPushing = false;
  }
}

function _applyView(v, custName, bookingId) {
  currentView = v;
  localStorage.setItem('gamtan_view', v);
  sessionStorage.setItem('gamtan_cal_pos', JSON.stringify({y:calYear,m:calMonth,d:selectedCalDate}));
  const isMonth = v === 'month';
  document.getElementById('month-cal').classList.toggle('mc-active', isMonth);
  document.getElementById('right').style.display = isMonth ? 'none' : '';
  if(isMonth) {
    document.getElementById('right').classList.remove('mobile-show');
    selectedId = null;
    renderMonthCal();
  } else if(custName) {
    renderList();
      setTimeout(()=>{ try{ showCustDetail(custName); }catch(e){} }, 30);
  } else if(bookingId) {
    selectedId = bookingId;
    renderList();
      const b = bookings.find(x=>x.id===bookingId);
    if(b) {
      renderWorkflow(b);
      const right = document.getElementById('right');
      if(right) {
        right.scrollTop = 0;
        if(window.innerWidth <= 768) {
          right.classList.add('mobile-show');
          const nameEl = document.getElementById('mobile-back-name');
          if(nameEl) nameEl.textContent = b.name + '님';
        }
      }
    }
  } else {
    renderList();
    }
}

window.addEventListener('popstate', function(e) {
  applyNavState(e.state);
});

function setView(v) {
  currentView = v;
  localStorage.setItem('gamtan_view', v);
  sessionStorage.setItem('gamtan_cal_pos', JSON.stringify({y:calYear,m:calMonth,d:selectedCalDate}));

  const isMonth = v === 'month';
  document.getElementById('month-cal').classList.toggle('mc-active', isMonth);
  document.getElementById('right').style.display = isMonth ? 'none' : '';
  if(isMonth) {
    document.getElementById('right').classList.remove('mobile-show');
    selectedId = null;
    renderMonthCal();
  } else {
    renderList();
    }
  pushNav({ view: v });
}

  const shipped = wShipped(b, key);
  const bg    = shipped ? '#dcfce7' : ready ? '#dbeafe' : '#f5f3ff';
  const color = shipped ? '#15803d' : ready ? '#1d4ed8' : '#7c3aed';

  return `<span data-wkey="${key}" data-label="${icon} ${label}"
    style="display:inline-flex;align-items:center;gap:3px;font-size:11px;background:${bg};color:${color};border:1.5px solid ${border};border-radius:6px;padding:3px 6px;font-weight:700;white-space:nowrap">

// 예약별 작업 항목 목록 반환 (액자, 원본 등 구성에 따라)
function getWorkItems(b) {
  const items = [];
  const goods = PRODUCT_GOODS[b.product] || PRODUCT_GOODS.story;
  if(goods.frame)     items.push('액자');
  if(goods.frame && b.product !== 'profile' && b.product !== 'id') items.push('보정본');
  if(goods.originals && b.product !== 'bigfam') items.push('원본');
  if(b.product === 'bigfam' && b.bigfamUpgrade) { items.push('앨범'); items.push('원본'); }
  if(b.reviewed)      items.push('리뷰포켓');
  if(b.extraItems) {
    EXTRA_ITEMS.forEach(item => {
      if((parseInt(b.extraItems[item.key])||0) > 0) items.push(item.key);
    });
  }
  return items;
}
// workChecks 헬퍼
function wReady(b, key)   { return !!(b.workChecks||{})[key+'_ready']; }
function wShipped(b, key) { return !!(b.workChecks||{})[key+'_shipped']; }
function saveShipMemo(bid, key, val) {

  b.shipMemo[key] = val;

function removeShipRow(bid, key, safeName) {
  const b = bookings.find(x=>x.id===bid);
  if(!b) return;
  // 기본 항목은 삭제 불가
  const baseKeys = ['액자','앨범','원본','보정본','리뷰포켓','사진선택'];
  if(baseKeys.includes(key)) return;
  // extraItems에서 제거
  if(b.extraItems) delete b.extraItems[key];
  // customShipRows에서 제거
  if(b.customShipRows) b.customShipRows = b.customShipRows.filter(r=>r.key!==key);
  if(b.workChecks) {
    delete b.workChecks[key+'_ready'];
    delete b.workChecks[key+'_shipped'];
    delete b.workChecks[key+'_ready_date'];
    delete b.workChecks[key+'_shipped_date'];
  }
  if(b.shipMemo) delete b.shipMemo[key];
  saveBookings();
  const row = document.getElementById(`ship-row-${bid}-${key}`);
  if(row) row.remove();
}

function toggleWork(bid, key, field) {
  const b = bookings.find(x=>x.id===bid);
  if(!b) return;
  if(!b.workChecks) b.workChecks = {};
  const k = key + '_' + field;
  b.workChecks[k] = !b.workChecks[k];
  // 날짜 자동 기록
  const dateKey = k + '_date';
  if(b.workChecks[k]) {
    const now = new Date();
    b.workChecks[dateKey] = `${now.getMonth()+1}/${now.getDate()}`;
  } else {
    delete b.workChecks[dateKey];
  }
  // 출고 체크 시 완료도 자동 체크
  if(field==='shipped' && b.workChecks[k]) {
    b.workChecks[key+'_ready'] = true;
    if(!b.workChecks[key+'_ready_date']) {
      const now = new Date();
      b.workChecks[key+'_ready_date'] = `${now.getMonth()+1}/${now.getDate()}`;
    }
  }
  saveBookings();
  // 해당 행만 즉시 갱신
  const wc = b.workChecks;
  const row = document.getElementById(`ship-row-${bid}-${key}`);
  if(row) {
    const ready   = !!(wc[key+'_ready']);
    const shipped = !!(wc[key+'_shipped']);
    const readyDate   = wc[key+'_ready_date']   || '';
    const shippedDate = wc[key+'_shipped_date'] || '';
    row.style.background = shipped ? '#f0fdf4' : ready ? '#eff6ff' : '#fafafa';
    const btns = row.querySelectorAll('button');
    if(btns[0]) {
      btns[0].style.background   = ready ? '#1d4ed8' : '#fff';
      btns[0].style.borderColor  = ready ? '#1d4ed8' : '#d1d5db';
      btns[0].style.color        = ready ? '#fff' : '#9ca3af';
      btns[0].textContent        = ready ? '✓' : '';
    }
    if(btns[1]) {
      btns[1].style.background   = shipped ? '#15803d' : '#fff';
      btns[1].style.borderColor  = shipped ? '#15803d' : '#d1d5db';
      btns[1].style.color        = shipped ? '#fff' : '#9ca3af';
      btns[1].textContent        = shipped ? '✓' : '';
    }
    const tds = row.querySelectorAll('td');
    if(tds[2]) tds[2].textContent = readyDate;
    if(tds[4]) tds[4].textContent = shippedDate;
  }
  refreshHistCardHeader(bid);
}
function getDynamicStatusLabel(b) {
  if(b.cancelled) return {label:'취소', color:'#9ca3af'};
  if(b.postponed)  return {label:'연기', color:'#f97316'};
  const stage = b.currentStage||0;
  const isId = b.product==='id';
  const isAllDone = isId ? stage >= 2 : stage >= 8;
  if(isAllDone) return {label:'완료', color:'#15803d'};
  // 미입금 체크 — 가장 먼저 표시
  if(isUnpaid(b)) return {label:'미입금', color:'#dc2626'};
  // 완납 → 증명사진은 바로 완료, 일반 상품은 모니터/작업중/완료
  const amt = b.priceItems ? priceTotal(b) : 0;
  const paid = b.payments ? paidTotal(b) : 0;
  if(amt > 0 && paid >= amt) {
    if(isId) return {label:'완료', color:'#15803d'};
    // 사진 선택 전 → 모니터
    if(!b.photoSelected) return {label:'모니터', color:'#d97706'};
    // 사진 선택 후 → 작업 체크 항목 확인
    const workItems = getWorkItems(b);
    if(workItems.length > 0) {
      const allShipped = workItems.every(k => wShipped(b, k));
      if(allShipped) return {label:'완료', color:'#15803d'};
    }
    return {label:'작업중', color:'#0891b2'};
  }
  // 단계 배지는 CHECK_LABELS 연동 없이 단계명만 표시
  const names = isId ? ID_STAGE_NAMES : STAGE_NAMES;
  const baseColor = (!isId && stage>3) ? '#059669' : '#6366f1';
  return {label: names[stage]||'예약 접수', color: baseColor};
}

function getProgressBadge(b) {
  const stage = b.currentStage||0;
  const isId = b.product==='id';

// 미입금 여부: 증명사진·완료·취소·연기 제외, 예약금 실제 입금액이 0인 경우
function isUnpaid(b) {
  if(b.cancelled || b.postponed || b._phonePlaceholder) return false;
  if(b.product === 'id') return false; // 증명사진은 예약금 없음
  const stage = b.currentStage||0;
  const isAllDone = stage >= 8;
  if(isAllDone) return false;
  // 입금 확인 체크(stageChecks[1][0])가 돼 있으면 입금된 것으로 간주
  if(b.stageChecks?.[1]?.[0]) return false;
  // 실제 입금액이 0이면 미입금
  const depositAmt = Number(b.payments?.deposit?.amt || 0);
  const midAmt = (b.payments?.midterms||[]).reduce((s,r)=>s+Number(r.amt||0),0);
  return (depositAmt + midAmt) === 0;
}
const UNPAID_BADGE = `<span style="font-size:10px;background:#fee2e2;color:#dc2626;border:1px solid #fca5a5;border-radius:6px;padding:1px 7px;font-weight:700;white-space:nowrap;flex-shrink:0">미입금</span>`;

function matchesQuery(b, query) {
  if(!query) return true;
  const q = query.toLowerCase();
  // 이름
  if((b.name||'').toLowerCase().includes(q)) return true;
  // 전화번호 뒷번호 (숫자만)
  const phoneDigits = (b.phone||'').replace(/[^0-9]/g,'');
  const queryDigits = query.replace(/[^0-9]/g,'');
  if(queryDigits.length >= 3 && phoneDigits.endsWith(queryDigits)) return true;
  // 이메일
  if((b.email||'').toLowerCase().includes(q)) return true;
  // 예약 메모
  if((b.memo||'').toLowerCase().includes(q)) return true;
  // 예약 가족이름 (구 필드)
  if((b.familyNames||'').toLowerCase().includes(q)) return true;
  // 아이이름 (구 필드)
  if((b.childName||'').toLowerCase().includes(q)) return true;
  // 고객번호
  if(custNumbers[b.name] && String(custNumbers[b.name]).padStart(4,'0').includes(q)) return true;
  // 날짜
  if((b.date||'').includes(q)) return true;
  // 상품명
  const pName = (PRODUCTS[b.product]||PRODUCTS.story).name;
  if(pName.toLowerCase().includes(q)) return true;
  // 가족 정보 (새 custProfiles)
  const prof = custProfiles[b.name]||{};
  if((prof.familyInfo||'').toLowerCase().includes(q)) return true;
  // 고객 메모 (전체)
  if((custMemos[b.name]||'').toLowerCase().includes(q)) return true;
  // 활동 로그
  if((custLogs[b.name]||[]).some(l=>(l.text||'').toLowerCase().includes(q))) return true;
  return false;
}

function renderList() {
  const el = document.getElementById('booking-list');
  if(!el) return; // DOM 아직 준비 안 됐으면 무시
  // 단계 필터 활성화 시 → 별도 뷰로 표시
  if(stageFilter === 'unpaid') { renderListByUnpaid(el); return; }
  if(stageFilter !== null) { renderListByStageFilter(el); return; }
  // 캘린더 모드: 예약 없어도 캘린더는 보여줌
  el.classList.remove('cal-mode');
  el.style.padding = '8px';
  if(!bookings.length) { el.innerHTML='<div class="no-bookings">예약이 없습니다.<br>위 버튼으로 추가하세요.</div>'; return; }
  if(currentView==='cust') { renderListByCust(el); return; }
  if(currentView==='done') { renderListByDone(el); return; }
  renderListByDate(el);
}

function renderListByUnpaid(el) {
  el.classList.remove('cal-mode');
  el.style.padding = '8px';
  const query = (document.getElementById('search-input')?.value||'').trim();
  const filtered = bookings
    .filter(b => isUnpaid(b) && matchesQuery(b, query))
    .sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time));

  if(!filtered.length) {
    el.innerHTML = `<div class="no-bookings" style="color:#15803d">미입금 고객이 없습니다 ✅</div>`;
    return;
  }
  el.innerHTML = `
    <div style="padding:6px 4px 8px;display:flex;align-items:center;gap:6px">
      <span style="font-size:12px;font-weight:700;color:#dc2626">💸 미입금</span>

function renderListByDone(el) {

function renderListByDate(el) {
  const query = (document.getElementById('search-input')?.value||'').trim();
  // 이번 달 활성 예약 (날짜 필터 없이 전체 — 캘린더 도트용)
  const activeAll = bookings.filter(b=>{ const maxS=b.product==='id'?2:8; return (b.currentStage||0)<maxS; });
  // 날짜별 그룹 (도트 표시용)
  const byDate = {};
  activeAll.forEach(b=>{ if(!byDate[b.date]) byDate[b.date]=[]; byDate[b.date].push(b); });

  // 캘린더 그리기
  const firstDay = new Date(calYear, calMonth, 1);
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const startDow = firstDay.getDay(); // 0=일
  const todayStr = new Date().toISOString().slice(0,10);
  const dayNames = ['일','월','화','수','목','금','토'];

  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div class="cal-cell empty"><span class="cal-day-num"></span></div>`;
  for(let d=1;d<=daysInMonth;d++) {
    const ds = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const bksDay = byDate[ds]||[];
    const isToday = ds===todayStr;
    const isSel = ds===selectedCalDate;
    const dow = (startDow+d-1)%7;
    const dotHtml = bksDay.slice(0,5).map(b=>`<div class="cal-dot" style="background:${PRODUCTS[b.product]?.color||'#888'}"></div>`).join('');
    cells += `<div class="cal-cell${isToday?' today':''}${isSel?' selected':''}${dow===0?' sun':dow===6?' sat':''}" onclick="selectCalDate('${ds}')">
      <span class="cal-day-num">${d}</span>
      ${bksDay.length?`<div class="cal-dots">${dotHtml}</div>`:''}
    </div>`;
  }

  // 선택된 날짜의 예약 리스트 (검색 포함)
  // 검색어 있으면 전체 활성 예약에서 검색 결과 보여줌
  let selBks, selLabel;
  if(query) {
    selBks = activeAll.filter(b=>matchesQuery(b,query)).sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time));
    selLabel = `🔍 검색 결과`;
  } else {
    selBks = (byDate[selectedCalDate]||[]).sort((a,b)=>a.time.localeCompare(b.time));
    selLabel = formatCalDateLabel(selectedCalDate);
  }
  const selListHtml = selBks.length
    ? selBks.map(b=>bookingCard(b)).join('')
    : `<div class="cal-empty-day">${query?'검색 결과가 없습니다':'예약이 없습니다'}</div>`;

  el.innerHTML = `
    <div class="calendar-wrap">
      <div class="cal-header">
        <button class="cal-nav" onclick="calNav(-1)">‹</button>
        <span class="cal-title">${calYear}년 ${calMonth+1}월</span>
        <button class="cal-nav" onclick="calNav(1)">›</button>
      </div>
      <div class="cal-grid">
        ${dayNames.map((n,i)=>`<div class="cal-dow${i===0?' sun':i===6?' sat':''}">${n}</div>`).join('')}
        ${cells}
      </div>
    </div>
    <div class="cal-sel-label">
      <span>${selLabel}</span>
      ${selBks.length?(()=>{
        const totalP = selBks.reduce((s,b)=>(parseInt(b.adults)||0)+(parseInt(b.kids)||0)+s,0);
        return `<span class="cal-sel-count">${selBks.length}건</span>`
          + (totalP>0?`<span style="font-size:11px;font-weight:800;color:#1d4ed8;background:#dbeafe;border-radius:8px;padding:2px 8px;margin-left:4px">👥 총 ${totalP}명</span>`:'');
      })():''}
    </div>
    <div style="overflow-y:auto;flex:1;padding:4px 8px 8px">
      ${selListHtml}
    </div>`;
}

function calNav(dir) {
  calMonth += dir;
  if(calMonth > 11) { calMonth=0; calYear++; }
  if(calMonth < 0)  { calMonth=11; calYear--; }
  sessionStorage.setItem('gamtan_cal_pos', JSON.stringify({y:calYear,m:calMonth,d:selectedCalDate}));
  renderAll();
}

function formatCalDateLabel(ds) {
  if(!ds) return '';
  const d = new Date(ds); d.setHours(12);
  const todayD = new Date(); todayD.setHours(0,0,0,0);
  const selD = new Date(ds); selD.setHours(0,0,0,0);
  const diff = Math.round((selD-todayD)/(1000*60*60*24));
  const dayKo = ['일','월','화','수','목','금','토'][d.getDay()];
  const base = `${d.getMonth()+1}월 ${d.getDate()}일 (${dayKo})`;
  if(diff===0) return `📍 오늘 · ${base}`;
  if(diff===1) return `📌 내일 · ${base}`;
  if(diff===-1) return `${base} (어제)`;
  if(diff>0) return `${base} (${diff}일 후)`;
  return `${base} (${Math.abs(diff)}일 전)`;
}

function subCard(b) {
  if(b._phonePlaceholder) return ''; // 전화등록 placeholder는 목록에서 숨김

  const d = new Date(b.date);
  const today = new Date(); today.setHours(0,0,0,0); d.setHours(0,0,0,0);
  const diff = Math.round((d-today)/(1000*60*60*24));
  const dateStr = diff===0?'오늘':diff===1?'내일':`${d.getMonth()+1}/${d.getDate()}`;
  const isId2 = b.product==='id';
  const isAllDone2 = isId2 ? stage >= 2 : stage >= 8;
  const hasShooting2 = !isId2 && stage > 3;
  const dots = isId2
    ? Array.from({length:2},(_,i)=>{
        const cls = isAllDone2 ? ' final-done' : i<stage ? ' done' : i===stage ? ' cur' : '';
        return `<div class="sub-dot${cls}"></div>`;
      }).join('')
    : Array.from({length:8},(_,i)=>{
        const isPost = i >= 3;
        let cls = '';
        if(isAllDone2) {
          cls = i === 7 ? ' final-done' : (isPost ? ' post-done' : ' done');

          cls = i<stage ? ' done' : i===stage ? ' cur' : '';
        } else {
          if(i < stage) cls = hasShooting2 ? ' post-done' : ' post-wait';
          else if(i === stage) cls = hasShooting2 ? ' post-cur' : ' cur';
          else cls = ' post-wait';
        }
        return (i===3 ? '<span style="font-size:9px;opacity:.4;margin:0 1px">📷</span>' : '') + `<div class="sub-dot${cls}"></div>`;
      }).join('');
  const {label: stageLabel, color: stageColor} = getDynamicStatusLabel(b);
  const memoRow = b.memo&&b.memo.trim() ? `<div class="sub-memo">📝 ${escHtml(b.memo.length>32?b.memo.substring(0,32)+'…':b.memo)}</div>` : '';
  const unpaidSub = isUnpaid(b);
